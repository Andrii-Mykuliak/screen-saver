<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>зимове вікно</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%2316275a'/%3E%3Cpath d='M16 4v24M5.6 10l20.8 12M5.6 22l20.8-12' stroke='%23dcebfa' stroke-width='2.2' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
  html, body { margin: 0; height: 100%; background: #0a0b10; overflow: hidden; }
  canvas {
    display: block; width: 100vw; height: 100vh; touch-action: none;
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
</style>
</head>
<body>
<canvas aria-hidden="true"></canvas>
<script>
"use strict";

// ---------- helpers ----------
const TAU = Math.PI * 2;
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = (t) => t * t * (3 - 2 * t);
function hash(x, y, s) {
  let h = (Math.imul(x | 0, 374761393) + Math.imul(y | 0, 668265263) + Math.imul(s | 0, 1274126177)) | 0;
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
}
function noise2(x, y, s) {
  const xi = Math.floor(x), yi = Math.floor(y);
  const u = smooth(x - xi), v = smooth(y - yi);
  return lerp(lerp(hash(xi, yi, s), hash(xi + 1, yi, s), u), lerp(hash(xi, yi + 1, s), hash(xi + 1, yi + 1, s), u), v);
}
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const pack = (r, g, b) => (clamp(r | 0, 0, 255) << 16) | (clamp(g | 0, 0, 255) << 8) | clamp(b | 0, 0, 255);
const cssCache = new Map();
function css(c) {
  c &= 0xf8f8f8;
  let v = cssCache.get(c);
  if (v === undefined) cssCache.set(c, (v = `rgb(${c >>> 16},${(c >>> 8) & 255},${c & 255})`));
  return v;
}
const charCache = [];
const chr = (code) => charCache[code] || (charCache[code] = String.fromCharCode(code));
function dirGlyph(a) {
  a = ((a % Math.PI) + Math.PI) % Math.PI;
  if (a < Math.PI / 8 || a >= (7 * Math.PI) / 8) return 45;
  if (a < (3 * Math.PI) / 8) return 92;
  if (a < (5 * Math.PI) / 8) return 124;
  return 47;
}
const RAMP = ".:;=+*#%@";
const SEED = (Math.random() * 1e6) | 0;
const QS = new URLSearchParams(location.search);

// ---------- layout ----------
const L = {};
let canvas, ctx, sceneC, S, skyC, backC, fgC, fillC, fillCtx, fillImg, gridC;
let kind, baseFill, baseG, baseC, amb, candleG, fgCells = [];
let frostG, frostB, mist, mistB, clr;
let W3 = 0, G, C, rushnyks = [];
let X;                                   // the 2D context world helpers draw into

function layout() {
  const w = innerWidth, h = innerHeight, dpr = Math.min(devicePixelRatio || 1, 2);
  const cw = clamp(Math.round(w / 260), 4, 8), ch = Math.round(cw * 1.5);
  const cols = Math.ceil(w / cw), rows = Math.ceil(h / ch), n = cols * rows;
  const SILL = 2;
  const bandRows = Math.max(4, Math.ceil(72 / ch));
  const wh = rows - SILL - bandRows, ww = cols, wx0 = 0, wy0 = 0;
  const FX = Math.max(2, Math.round(ww / 60)), FY = Math.max(1, Math.round((FX * cw) / ch));
  const MX = Math.max(1, Math.round(FX * 0.5)), MY = Math.max(1, Math.round((MX * cw) / ch));
  const gx0 = wx0 + FX, gy0 = wy0 + FY, gw = ww - 2 * FX, gh = wh - 2 * FY;
  const nc = ww * cw > wh * ch * 1.15 ? 3 : 2, nr = nc === 3 ? 2 : 3;
  const pwc = Math.floor((gw - (nc - 1) * MX) / nc), phr = Math.floor((gh - (nr - 1) * MY) / nr);
  const mcols = [], mrows = [], panes = [];
  for (let k = 1; k < nc; k++) mcols.push(gx0 + k * pwc + (k - 1) * MX);
  for (let k = 1; k < nr; k++) mrows.push(gy0 + k * phr + (k - 1) * MY);
  for (let j = 0; j < nr; j++) {
    for (let k = 0; k < nc; k++) {
      const x = gx0 + k * (pwc + MX), y = gy0 + j * (phr + MY);
      panes.push({ x, y, w: k === nc - 1 ? gx0 + gw - x : pwc, h: j === nr - 1 ? gy0 + gh - y : phr });
    }
  }
  Object.assign(L, {
    w, h, dpr, cw, ch, cols, rows, n, SILL, wh, ww, wx0, wy0, FX, FY, MX, MY, gx0, gy0, gw, gh, mcols, mrows, panes,
    SW: cols * 2, SH: rows * 3, GX0: gx0 * 2, GY0: gy0 * 3, GW: gw * 2, GH: gh * 3,
  });
  L.u = L.GH / (100 - Y0);
  L.Wd = L.GW / L.u;
}

function mk(w, h) { const c = document.createElement("canvas"); c.width = w; c.height = h; return c; }
const Y0 = 0;
const setW = (c) => c.setTransform(L.u, 0, 0, L.u, L.GX0, L.GY0 - Y0 * L.u);

// ---------- static room: wall, frame, sill, rushnyks, candle, geranium ----------
function buildCells() {
  const { n, cols, rows, wx0, wy0, ww, wh, gx0, gy0, gw, gh, FX, FY, MX, MY, mcols, mrows, SILL } = L;
  kind = new Uint8Array(n); baseFill = new Uint8ClampedArray(n * 3); baseG = new Uint16Array(n); baseC = new Uint32Array(n);
  amb = new Float32Array(n); candleG = new Float32Array(n);
  fgCells = []; rushnyks = [];
  const inPane = (c, r) => L.panes.some((p) => c >= p.x && c < p.x + p.w && r >= p.y && r < p.y + p.h);
  const sillTop = wy0 + wh;
  const fcx = wx0 + Math.round(ww * 0.2), fcy = sillTop - 5;
  L.flame = { c: fcx, r: fcy };
  const sig = ww * 0.2;
  const band = sillTop + SILL;
  const rw = clamp(Math.round(cols * 0.024), 4, 7);
  const hasRush = false;
  const set = (i, f, g, col) => { baseFill[i * 3] = f[0]; baseFill[i * 3 + 1] = f[1]; baseFill[i * 3 + 2] = f[2]; baseG[i] = g; baseC[i] = col; };

  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      const i = r * cols + c;
      const inWin = c >= wx0 && c < wx0 + ww && r >= wy0 && r < wy0 + wh;
      // ambient light spilling from the window and warmth from the candle
      const dxw = Math.max(wx0 - c, 0, c - (wx0 + ww - 1)), dyw = Math.max(wy0 - r, 0, r - (sillTop - 1)) * 1.5;
      amb[i] = Math.exp(-Math.hypot(dxw, dyw) / (wh * 0.55));
      const dx = c - fcx, dy = (r - fcy) * 1.5;
      candleG[i] = Math.exp(-(dx * dx + dy * dy) / (2 * sig * sig));

      if (inWin) {
        if (inPane(c, r)) { kind[i] = 3; continue; }
        kind[i] = 1;
        const vert = c < gx0 || c >= gx0 + gw || mcols.some((m) => c >= m && c < m + MX);
        const horiz = r < gy0 || r >= gy0 + gh || mrows.some((m) => r >= m && r < m + MY);
        const outer = c === wx0 || c === wx0 + ww - 1 || r === wy0 || r === sillTop - 1;
        const inner = c === gx0 - 1 || c === gx0 + gw || r === gy0 - 1 || r === gy0 + gh;
        const f = outer ? [8, 12, 24] : inner ? [12, 20, 40] : [10, 16, 32];
        const g = vert && horiz ? 43 : vert ? 124 : 61;
        set(i, f, g, outer ? pack(34, 62, 112) : inner ? pack(86, 130, 190) : pack(56, 92, 150));
        continue;
      }
      if (r >= sillTop && r < sillTop + SILL) {
        kind[i] = 2;
        const top = r === sillTop;
        set(i, top ? [34, 24, 16] : [20, 14, 11], top ? 61 : 45, top ? pack(214, 150, 84) : pack(150, 100, 62));
        continue;
      }
      // wall
      const nz = noise2(c * 0.18, r * 0.27, SEED) * 0.5 + hash(c, r, SEED) * 0.5;
      if (r >= band) {
        kind[i] = 4;
        if (r === band) {
          set(i, [10, 16, 34], (c & 1) ? 62 : 60, pack(236, 184, 70));
        } else {
          const f = [9 + nz * 5, 14 + nz * 6, 30 + nz * 10];
          set(i, f, hash(c, r, SEED + 3) < 0.07 ? (hash(c, r, 8) < 0.5 ? 46 : 58) : 0, pack(70, 104, 170));
        }
      } else {
        kind[i] = 0;
        const f = [11 + nz * 5, 11 + nz * 5, 15 + nz * 6];
        set(i, f, hash(c, r, SEED + 9) < 0.06 ? (hash(c, r, 4) < 0.5 ? 46 : 58) : 0, pack(78, 74, 92));
      }
    }
  }

  // embroidered rushnyks hang on both sides of the window
  if (hasRush) {
    for (const side of [-1, 1]) {
      const x0 = side < 0 ? gx0 + 1 : gx0 + gw - 1 - rw;
      const y1 = wy0 + Math.round(wh * 0.64);
      rushnyks.push({ x0, y1 });
      for (let r = wy0; r <= y1; r++) {
        for (let k = 0; k < rw; k++) {
          const i = r * cols + x0 + k;
          kind[i] = 5;
          const lr = r - wy0, ci = (rw - 1) / 2, m = lr % 8, hw = (m < 4 ? m : 7 - m) * (ci / 3);
          const edge = k === 0 || k === rw - 1;
          let g = 0, col = pack(200, 40, 44);
          if (r === y1) { set(i, [14, 12, 16], 124, pack(232, 220, 190)); continue; }
          if (edge) { g = 73; col = pack(34, 30, 38); }
          else if (Math.abs(Math.abs(k - ci) - hw) < 0.75) { g = 120; col = pack(212, 44, 48); }
          else if (lr % 8 === 4 && Math.abs(k - ci) < 0.6) { g = 43; col = pack(40, 34, 42); }
          set(i, [24, 18, 22], g || 58, g ? col : pack(96, 84, 74));
        }
      }
    }
  }

  // foreground objects standing on the sill, in front of the glass
  const put = (c, r, f, g, col) => { if (c >= 0 && c < cols && r >= 0 && r < rows) fgCells.push({ i: r * cols + c, f, g, col }); };
  for (let k = 0; k < 3; k++) put(fcx, sillTop - 4 + k, [40, 34, 24], 124, pack(240, 226, 190));
  for (let k = -1; k <= 1; k++) put(fcx + k, sillTop - 1, [34, 26, 12], 95, pack(230, 184, 92));
  put(fcx, sillTop - 1, [34, 26, 12], 61, pack(230, 184, 92));
  const pcx = wx0 + Math.round(ww * 0.78);
  for (let k = -2; k <= 2; k++) put(pcx + k, sillTop - 2, [40, 20, 12], 61, pack(236, 140, 90));
  for (let k = -1; k <= 1; k++) put(pcx + k, sillTop - 1, [34, 16, 10], 35, pack(210, 110, 70));
  for (let dy = 0; dy < 5; dy++) {
    for (let dx = -4; dx <= 4; dx++) {
      const e = (dx / 4.3) ** 2 + ((dy - 2) / 2.7) ** 2;
      if (e > 1 || hash(dx, dy, SEED + 21) < 0.2) continue;
      const bloom = hash(dx, dy, SEED + 22) < 0.22;
      put(pcx + dx, sillTop - 3 - dy, bloom ? [40, 8, 12] : [6, 20, 12], bloom ? 64 : "%&*".charCodeAt((hash(dx, dy, 5) * 3) | 0), bloom ? pack(240, 88, 96) : pack(76, 156, 88));
    }
  }
}

// ---------- frost: fern-like branches grown from the pane edges ----------
function genFrost() {
  const { n, cols } = L;
  frostG = new Uint16Array(n); frostB = new Float32Array(n).fill(1e9);
  mist = new Float32Array(n); mistB = new Float32Array(n); clr = new Float32Array(n);
  const rnd = mulberry32(SEED + 7);
  for (const p of L.panes) {
    const mn = Math.min(p.w, p.h * 1.5), delay = rnd() * 5;
    for (let r = p.y; r < p.y + p.h; r++) {
      for (let c = p.x; c < p.x + p.w; c++) {
        const i = r * cols + c;
        const dE = Math.min(c - p.x, p.x + p.w - 1 - c, (r - p.y) * 1.5, (p.y + p.h - 1 - r) * 1.5);
        let m = clamp(1 - dE / (mn * 0.1), 0, 1);
        m = Math.pow(m, 0.8);
        m *= 0.55 + 0.7 * noise2(c * 0.22, r * 0.15, SEED);
        m += 0.16 * ((r - p.y) / p.h) * clamp(1 - dE / (mn * 0.45), 0, 1);
        mist[i] = clamp(m, 0, 1);
        mistB[i] = delay + dE * 0.5;
      }
    }
    const grow = (x, y, a, len, depth, t0) => {
      let tr = 0, next = 1.4 + rnd() * 0.8;
      while (tr < len) {
        x += Math.cos(a) * 0.5; y += (Math.sin(a) * 0.5) / 1.5; tr += 0.5;
        a += (rnd() - 0.5) * 0.12;
        const c = Math.floor(x), r = Math.floor(y);
        if (c < p.x || c >= p.x + p.w || r < p.y || r >= p.y + p.h) break;
        const i = r * cols + c, t = t0 + tr * 0.45;
        if (t < frostB[i]) { frostB[i] = t; frostG[i] = tr > len - 0.8 && rnd() < 0.5 ? 42 : dirGlyph(a); }
        if (depth < 2 && tr > next) {
          next += 2.2 + rnd() * 1.0;
          const sp = 0.78 - 0.1 * depth, sl = len * (0.42 - 0.07 * depth);
          grow(x, y, a + sp, sl, depth + 1, t); grow(x, y, a - sp, sl, depth + 1, t);
        }
      }
    };
    for (let x = p.x + 2; x < p.x + p.w - 1; x += 16 + rnd() * 10) {
      grow(x, p.y + 0.01, Math.PI / 2 + (rnd() - 0.5) * 0.8, mn * (0.08 + 0.14 * rnd()), 0, delay + rnd() * 8);
      grow(x, p.y + p.h - 0.01, -Math.PI / 2 + (rnd() - 0.5) * 0.8, mn * (0.1 + 0.16 * rnd()), 0, delay + rnd() * 8);
    }
    for (let y = p.y + 1.5; y < p.y + p.h - 1; y += 12 + rnd() * 6) {
      grow(p.x + 0.01, y, (rnd() - 0.5) * 0.8, mn * (0.08 + 0.14 * rnd()), 0, delay + rnd() * 8);
      grow(p.x + p.w - 0.01, y, Math.PI + (rnd() - 0.5) * 0.8, mn * (0.08 + 0.14 * rnd()), 0, delay + rnd() * 8);
    }
    const corners = [[p.x, p.y, 0], [p.x + p.w - 0.01, p.y, 1], [p.x, p.y + p.h - 0.01, 3], [p.x + p.w - 0.01, p.y + p.h - 0.01, 2]];
    for (const [cx, cy, q] of corners) {
      if (rnd() < 0.15) continue;
      const base = [0, Math.PI / 2, Math.PI, -Math.PI / 2][q];
      for (let k = 0; k < 6; k++) grow(cx, cy, base + 0.1 + (k / 5) * (Math.PI / 2 - 0.2), mn * (0.2 + 0.08 * rnd()), 0, delay + 2 + rnd() * 3);
    }
  }
}

// ---------- the world outside: units of 1/100 of the glass height ----------
const poly = (pts, fill) => { X.beginPath(); X.moveTo(pts[0], pts[1]); for (let k = 2; k < pts.length; k += 2) X.lineTo(pts[k], pts[k + 1]); X.closePath(); X.fillStyle = fill; X.fill(); };
const ell = (x, y, rx, ry, fill, rot = 0) => { X.beginPath(); X.ellipse(x, y, Math.max(0.01, rx), Math.max(0.01, ry), rot, 0, TAU); X.fillStyle = fill; X.fill(); };
const ln = (x1, y1, x2, y2, w, col) => { X.beginPath(); X.moveTo(x1, y1); X.lineTo(x2, y2); X.lineWidth = w; X.strokeStyle = col; X.lineCap = "round"; X.stroke(); };
function glow(x, y, r, rgb, a) {
  const g = X.createRadialGradient(x, y, 0, x, y, r);
  g.addColorStop(0, `rgba(${rgb},${a})`); g.addColorStop(1, `rgba(${rgb},0)`);
  X.globalCompositeOperation = "lighter"; X.fillStyle = g; X.fillRect(x - r, y - r, r * 2, r * 2); X.globalCompositeOperation = "source-over";
}

let STARS = [], FLAKES = [], PERCHES = [], STEM = [], TWIGS = [], BERRIES = [];
let time = 0, puffs = [], notes = [], birds = [];
const farY = (x) => 68 + 3 * Math.sin(x * 0.05 + 1) + 2 * Math.sin(x * 0.11 + 2);
const cap = { text: "Святвечір. Снігурі на горобині", t0: 0.6, dur: 7 };
const setCap = (text, dur) => { cap.text = text; cap.t0 = time; cap.dur = dur; };
const hint = { until: 24 };
const star = { x: -12, y: 20, active: false, wait: 9, spark: 0 };

function buildWorld() {
  const Wd = L.Wd, rnd = mulberry32(SEED + 31);
  STARS = []; for (let k = 0; k < 70; k++) STARS.push({ x: rnd() * Wd, y: rnd() * 56, ph: rnd() * TAU, s: 0.5 + rnd() * 0.5 });
  FLAKES = []; const nf = Math.round((Wd * 100) / 60);
  for (let k = 0; k < nf; k++) FLAKES.push({ x: rnd() * (Wd + 10) - 5, y: rnd() * 104 - 2, z: 0.2 + rnd() * 0.8, ph: rnd() * TAU });
  // a rowan branch sweeps in from the right edge, heavy with berries
  STEM = []; TWIGS = []; BERRIES = []; PERCHES = [];
  const x0 = Wd + 8, x1 = 0.4 * Wd;
  for (let k = 0; k <= 30; k++) { const t = k / 30; STEM.push({ x: lerp(x0, x1, t), y: 30 + 16 * t + 6 * Math.sin(t * 3.1) + 5 * t * t, w: lerp(3.4, 0.9, t) }); }
  const nT = clamp(Math.round(Wd / 16), 6, 12);
  for (let k = 0; k < nT; k++) {
    const t = 0.12 + (k / nT) * 0.84, i = Math.min(30, Math.round(t * 30)), p = STEM[i];
    const up = k % 2 === 0 ? -1 : 1, len = 8 + rnd() * 8;
    const ex = p.x - (3 + rnd() * 6), ey = p.y + up * len * (0.6 + rnd() * 0.5);
    TWIGS.push({ x: p.x, y: p.y, cx: p.x - 2, cy: p.y + up * len * 0.2, ex, ey, w: Math.max(0.5, p.w * 0.5) });
    const n = 4 + ((rnd() * 3) | 0);
    for (let b = 0; b < n; b++) { const a = rnd() * TAU, d = Math.sqrt(rnd()) * 2.4; BERRIES.push({ x: ex + Math.cos(a) * d, y: ey + Math.sin(a) * d * 0.8, r: 0.6 + rnd() * 0.3 }); }
  }
  for (let i = 5; i <= 28; i += 3) PERCHES.push({ x: STEM[i].x, y: STEM[i].y - STEM[i].w * 0.5, taken: null });
  birds = [];
  const nb = clamp(Math.round(Wd / 38), 3, 5);
  for (let k = 0; k < nb; k++) birds.push({ x: Wd + 12, y: 10 + Math.random() * 30, dir: -1, ph: Math.random() * 6, state: "wait", t: 0, wait: 0.3 + k * 1.6 + Math.random() * 2, perch: null, from: null, dur: 1, peck: 0, stay: 0, s: 3.1, flying: true });
}

function bakeSky() {
  X = skyC.getContext("2d"); setW(X);
  const Wd = L.Wd;
  const g = X.createLinearGradient(0, 0, 0, 72);
  g.addColorStop(0, "#04081f"); g.addColorStop(0.5, "#101e4c"); g.addColorStop(1, "#33497f");
  X.fillStyle = g; X.fillRect(-6, -6, Wd + 12, 130);
  const mx = 0.17 * Wd, my = 30;
  const h = X.createRadialGradient(mx, my, 4, mx, my, 34);
  h.addColorStop(0, "rgba(190,205,240,0.38)"); h.addColorStop(1, "rgba(190,205,240,0)");
  X.fillStyle = h; X.fillRect(mx - 34, my - 34, 68, 68);
  ell(mx, my, 7.4, 7.4, "#f0efdc");
  ell(mx - 2.2, my - 1.2, 1.7, 1.5, "rgba(170,170,155,0.5)"); ell(mx + 2.4, my + 2.2, 2.1, 1.7, "rgba(170,170,155,0.45)"); ell(mx + 0.5, my - 3.6, 1.2, 1.1, "rgba(170,170,155,0.4)");
}

function bakeBack() {
  X = backC.getContext("2d"); setW(X); X.clearRect(-1e3, -1e3, 3e3, 3e3);
  const Wd = L.Wd, rnd = mulberry32(SEED + 5);
  X.beginPath(); X.moveTo(-6, 110);
  for (let x = -6; x <= Wd + 6; x += 1) X.lineTo(x, farY(x));
  X.lineTo(Wd + 6, 110); X.closePath();
  const fh = X.createLinearGradient(0, 62, 0, 90); fh.addColorStop(0, "#6d82b0"); fh.addColorStop(1, "#b4c2de");
  X.fillStyle = fh; X.fill();
  for (const fx of [0.05, 0.12, 0.3, 0.55]) {
    const x = fx * Wd, hh = 14 + 8 * rnd(), y = farY(x) + 2;
    poly([x - hh * 0.3, y, x + hh * 0.3, y, x, y - hh], "#1c3250");
    poly([x - hh * 0.13, y - hh * 0.55, x + hh * 0.13, y - hh * 0.55, x, y - hh], "#cfdaee");
  }
  for (let k = 0; k < 12; k++) {
    const y = 80 + rnd() * 16, x = rnd() * Wd, len = 8 + rnd() * 18;
    X.beginPath(); X.moveTo(x, y); X.quadraticCurveTo(x + len / 2, y - 1.6 - rnd() * 1.6, x + len, y + 0.2);
    X.lineWidth = 1; X.strokeStyle = "rgba(244,248,255,0.6)"; X.stroke();
  }
  // the rowan branch with snow on top and clusters of berries
  const bark = "#33241f";
  for (let k = 0; k < STEM.length - 1; k++) {
    ln(STEM[k].x, STEM[k].y, STEM[k + 1].x, STEM[k + 1].y, STEM[k].w, bark);
    ln(STEM[k].x, STEM[k].y - STEM[k].w * 0.5, STEM[k + 1].x, STEM[k + 1].y - STEM[k + 1].w * 0.5, Math.max(0.35, STEM[k].w * 0.4), "rgba(244,248,255,0.95)");
  }
  for (const t of TWIGS) {
    X.beginPath(); X.moveTo(t.x, t.y); X.quadraticCurveTo(t.cx, t.cy, t.ex, t.ey); X.lineWidth = t.w; X.strokeStyle = bark; X.lineCap = "round"; X.stroke();
  }
  for (const b of BERRIES) { ell(b.x, b.y, b.r, b.r, "#c9283a"); ell(b.x - b.r * 0.3, b.y - b.r * 0.35, b.r * 0.35, b.r * 0.3, "#ff8a8a"); }
  for (const t of TWIGS) ell(t.ex, t.ey - 3.2, 2.2, 0.8, "rgba(244,248,255,0.9)");
}

function bakeFg() {
  X = fgC.getContext("2d"); setW(X); X.clearRect(-1e3, -1e3, 3e3, 3e3);
  const Wd = L.Wd;
  X.beginPath(); X.moveTo(-6, 110); X.lineTo(-6, 95);
  for (let x = -6; x <= Wd + 6; x += 2) X.lineTo(x, 94.6 - 1.4 * Math.sin(x * 0.07) - 0.8 * Math.sin(x * 0.23 + 1));
  X.lineTo(Wd + 6, 110); X.closePath(); X.fillStyle = "#e6eefa"; X.fill();
}

function bakeAll() {
  skyC = mk(L.SW, L.SH); backC = mk(L.SW, L.SH); fgC = mk(L.SW, L.SH);
  bakeSky(); bakeBack(); bakeFg();
  X = S; setW(X);
}

function star8(x, y, r, spin) {
  X.save(); X.translate(x, y);
  const sx = 0.2 + 0.8 * Math.abs(Math.cos(spin));
  X.scale(sx, 1);
  const face = Math.cos(spin) > 0, pts = [];
  for (let k = 0; k < 16; k++) { const rr = k % 2 ? r * 0.45 : r; const a = (k / 16) * TAU - Math.PI / 2; pts.push(Math.cos(a) * rr, Math.sin(a) * rr); }
  poly(pts, face ? "#ffd04a" : "#e8483c");
  ell(0, 0, r * 0.3, r * 0.3, face ? "#c8323c" : "#ffe08a");
  X.restore();
}

function bird(b) {
  X.save(); X.translate(b.x, b.y); X.scale(b.dir * b.s, b.s);
  const fl = b.flying, pk = b.peck > 0 ? Math.sin(b.peck * Math.PI) : 0;
  if (!fl) X.rotate(pk * 0.45);
  const k = Math.sin(b.ph);
  poly([-1.5, 0.1, -4.2, 0.9 + (fl ? k * 0.6 : 0), -4.1, -0.4, -1.5, -0.6], "#15151c");
  ell(0, 0, 2.1, 1.35, "#aab2c8");
  ell(0.9, 0.55, 1.45, 1.1, "#f0506a");
  ell(2.1, -0.6, 1.05, 1.0, "#14141a");
  poly([3.0, -0.8, 3.9, -0.45, 3.0, -0.2], "#2a2a2a");
  ell(2.3, -0.8, 0.18, 0.18, "#fff");
  if (fl) { ln(-0.2, -0.6, -1.4, -2.6 * k - 0.4, 0.9, "#3a3f52"); ln(0.5, -0.6, 1.3, -2.4 * k - 0.4, 0.9, "#4a4f62"); }
  else { ell(-0.6, -0.2, 1.4, 0.65, "#4a5068"); ln(-1.6, -0.1, 0.4, -0.1, 0.25, "#e8ecf4"); }
  if (!fl) { ln(-0.2, 1.1, -0.3, 1.9, 0.3, "#2a2a2a"); ln(0.5, 1.1, 0.6, 1.9, 0.3, "#2a2a2a"); }
  X.restore();
}

const puff = (x, y, n, spread, up = 2) => { for (let k = 0; k < n; k++) puffs.push({ x: x + (Math.random() - 0.5) * 2, y, vx: (Math.random() - 0.5) * spread, vy: -Math.random() * up, r: 0.5 + Math.random() * 0.8, life: 1 }); };
const spark = (x, y) => notes.push({ x, y, vx: -2 - Math.random() * 3, vy: 1 + Math.random() * 2.4, ch: [46, 42, 43, 39][(Math.random() * 4) | 0], rgb: "255,214,120", life: 1, d: 0.9 });

// ---------- simulation ----------
function update(dt) {
  time += dt;
  const Wd = L.Wd;
  for (const f of FLAKES) {
    f.y += (3.5 + 9 * f.z) * dt;
    f.x += (Math.sin(time * 0.55 + f.ph) * 2.6 + 1.2) * f.z * dt;
    if (f.y > 102) { f.y = -2; f.x = Math.random() * (Wd + 10) - 5; }
    if (f.x > Wd + 6) f.x = -5;
  }
  // the carol star drifts across the sky, scattering sparks
  if (!star.active) { star.wait -= dt; if (star.wait <= 0) { star.active = true; star.x = -12; setCap("Колядна зірка пливе над полем", 6); } }
  else {
    star.x += (Wd + 24) / 60 * dt; star.y = 16 + 7 * Math.sin(star.x * 0.045);
    if (time - star.spark > 0.05) { star.spark = time; spark(star.x - 3 + Math.random() * 2, star.y + (Math.random() - 0.5) * 6); }
    if (star.x > Wd + 12) { star.active = false; star.wait = 8 + Math.random() * 6; }
  }
  const free = () => { const f = PERCHES.filter((p) => !p.taken); return f.length ? f[(Math.random() * f.length) | 0] : null; };
  for (const b of birds) {
    b.t += dt;
    if (b.state === "wait") {
      b.ph += dt * 3;
      if (b.t > b.wait) {
        const p = free();
        if (p) { p.taken = b; b.perch = p; b.from = { x: b.x, y: b.y }; b.state = "fly"; b.t = 0; b.dur = Math.max(1.6, Math.hypot(p.x - b.x, p.y - b.y) / 30); b.flying = true; b.dir = p.x < b.x ? -1 : 1; }
        else b.t = 0;
      }
    } else if (b.state === "fly") {
      b.ph += dt * 16;
      const u = clamp(b.t / b.dur, 0, 1), e = 1 - Math.pow(1 - u, 2.2), p = b.perch;
      b.x = lerp(b.from.x, p.x, e); b.y = lerp(b.from.y, p.y - 1.5 * b.s, e) - Math.sin(u * Math.PI) * 6;
      if (u >= 1) { b.state = "sit"; b.t = 0; b.flying = false; b.stay = 4 + Math.random() * 9; b.peck = 0; puff(p.x, p.y - 1, 7, 6, 3); }
    } else if (b.state === "sit") {
      b.ph += dt * 2;
      if (!b.peck && Math.random() < dt * 0.6) b.peck = 0.0001;
      if (b.peck) { b.peck += dt * 2.4; if (b.peck > 1) b.peck = 0; }
      if (Math.random() < dt * 0.15) b.dir = -b.dir;
      if (b.t > b.stay) { b.perch.taken = null; b.state = "leave"; b.t = 0; b.flying = true; b.from = { x: b.x, y: b.y }; b.to = { x: -10 - Math.random() * 20, y: -6 - Math.random() * 14 }; b.dur = 4.4; b.dir = -1; puff(b.perch.x, b.perch.y - 1, 8, 7, 3); }
    } else {
      b.ph += dt * 16;
      const u = clamp(b.t / b.dur, 0, 1), e = u * u;
      b.x = lerp(b.from.x, b.to.x, e); b.y = lerp(b.from.y, b.to.y, e) - Math.sin(u * Math.PI) * 5;
      if (u >= 1) { b.state = "wait"; b.t = 0; b.wait = 1 + Math.random() * 6; b.x = Wd + 12; b.y = 6 + Math.random() * 34; b.dir = -1; }
    }
  }
  for (const p of puffs) { p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 4 * dt; p.life -= dt * 1.4; }
  puffs = puffs.filter((p) => p.life > 0);
  for (const p of notes) { p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt * (p.d || 0.55); }
  notes = notes.filter((p) => p.life > 0);
  if (clr) { for (let i = 0; i < clr.length; i++) if (clr[i] > 0) clr[i] = Math.max(0, clr[i] - dt * 0.022); }
}

// ---------- drawing the scene into the raster ----------
function blit(c) { S.save(); S.setTransform(1, 0, 0, 1, 0, 0); S.drawImage(c, 0, 0); S.restore(); }

function drawScene() {
  X = S; S.setTransform(1, 0, 0, 1, 0, 0); S.fillStyle = "#000"; S.fillRect(0, 0, L.SW, L.SH); setW(S);
  blit(skyC);
  for (const s of STARS) {
    const tw = 0.55 + 0.45 * Math.sin(time * (1.2 + s.s) + s.ph);
    S.fillStyle = `rgba(225,235,255,${(0.25 + 0.7 * tw * s.s).toFixed(3)})`; S.fillRect(s.x, s.y, 0.9 * s.s + 0.5, 0.9 * s.s + 0.5);
  }
  if (star.active) {
    glow(star.x, star.y, 30, "255,196,90", 0.3 + 0.06 * Math.sin(time * 5));
    star8(star.x, star.y, 6.4, time * 1.7);
  }
  blit(backC);
  for (const b of birds) if (b.x > -12 && b.x < L.Wd + 14) bird(b);
  for (const p of puffs) { X.beginPath(); X.arc(p.x, p.y, p.r, 0, TAU); X.fillStyle = `rgba(236,242,252,${Math.min(1, p.life).toFixed(3)})`; X.fill(); }
  blit(fgC);
  setW(S);
}

// ---------- turning the raster into characters ----------
function render() {
  const { cols, rows, cw, ch, dpr, SW, n } = L;
  drawScene();
  const id = S.getImageData(0, 0, SW, L.SH).data;
  const fd = fillImg.data;
  G.fill(0);
  const fl = 0.85 + 0.15 * Math.sin(time * 13) * Math.sin(time * 7.3) + 0.05 * Math.sin(time * 31);
  const fT = time + 14;

  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      const i = r * cols + c, o = i * 4, k = kind[i];
      if (k !== 3) {
        const a = amb[i], cg = candleG[i] * fl;
        const m = 0.7 + 0.9 * a;
        fd[o] = baseFill[i * 3] * m + 70 * cg * 0.55; fd[o + 1] = baseFill[i * 3 + 1] * m + 40 * cg * 0.55; fd[o + 2] = baseFill[i * 3 + 2] * m + 16 * cg * 0.55; fd[o + 3] = 255;
        const g = baseG[i];
        if (g) {
          const bc = baseC[i], mm = m + cg * 0.5;
          G[i] = g; C[i] = pack(((bc >>> 16) & 255) * mm + 40 * cg, ((bc >>> 8) & 255) * mm + 22 * cg, (bc & 255) * mm);
        }
        continue;
      }
      // glass: read the 2x3 samples that belong to this cell
      const px = c * 2, py = r * 3;
      let sr = 0, sg = 0, sb = 0, c0 = 0, c1 = 0, r0 = 0, r2 = 0;
      for (let j = 0; j < 3; j++) {
        for (let q = 0; q < 2; q++) {
          const p = ((py + j) * SW + px + q) * 4;
          const lum = (0.3 * id[p] + 0.59 * id[p + 1] + 0.11 * id[p + 2]) / 255;
          sr += id[p]; sg += id[p + 1]; sb += id[p + 2];
          if (q) c1 += lum; else c0 += lum;
          if (j === 0) r0 += lum; else if (j === 2) r2 += lum;
        }
      }
      let R = sr / 6, Gg = sg / 6, B = sb / 6;
      const cg = candleG[i] * fl * 0.45;
      R += 130 * cg; Gg += 78 * cg; B += 30 * cg;
      const lum = (c0 + c1) / 6;
      const gx = (c1 - c0) / 3, gy = (r2 - r0) / 2, mag = Math.hypot(gx, gy);
      let glyph = 0;
      if (mag > 0.2) glyph = dirGlyph(Math.atan2(gy, gx) + Math.PI / 2);
      else if (lum > 0.05) {
        const jit = Math.floor(hash(c, r, SEED) * 3) - 1;
        const di = lum > 0.5 ? Math.floor(((1 - lum) / 0.5) * 4.2) + 1 : Math.floor(Math.pow(lum / 0.5, 0.8) * 6.5) + 1;
        glyph = RAMP.charCodeAt(clamp(di + jit, 0, RAMP.length - 1));
      }
      const mx = Math.max(R, Gg, B, 1), boost = clamp(150 / mx, 1, 3.2);
      let fr = R * 0.26, fg = Gg * 0.26, fb = B * 0.3;
      let gr = clamp(R * boost * 0.95 + 24, 0, 255), gg2 = clamp(Gg * boost * 0.95 + 24, 0, 255), gb = clamp(B * boost * 0.95 + 30, 0, 255);

      // frost
      const eff = 1 - clr[i];
      let frostHide = 0;
      if (eff > 0.01) {
        const hasF = frostB[i] <= fT;
        const grown = smooth(clamp(fT / 26, 0, 1));
        const mi = Math.max(mist[i] * smooth(clamp((fT - mistB[i]) / 6, 0, 1)), 0);
        if (hasF && eff > 0.45) {
          const tw = 0.8 + 0.2 * Math.sin(time * 3 + hash(c, r, 3) * 40);
          const t = 0.5 * eff;
          fr = lerp(fr, 52, t); fg = lerp(fg, 82, t); fb = lerp(fb, 116, t);
          glyph = frostG[i]; const ek = smooth(clamp((eff - 0.45) / 0.4, 0, 1)); gr = lerp(gr, 224 * tw, ek); gg2 = lerp(gg2, 244 * tw, ek); gb = lerp(gb, 255 * tw, ek);
          frostHide = eff;
        } else if (mi > 0.04) {
          const t = 0.55 * mi * eff;
          fr = lerp(fr, 40, t); fg = lerp(fg, 64, t); fb = lerp(fb, 96, t);
          const hz = mi * eff;
          if (hz > 0.22 && hash(c, r, 6) < hz * 0.95) { glyph = hash(c, r, 7) < 0.55 ? 46 : hash(c, r, 7) < 0.8 ? 58 : 39; gr = 186; gg2 = 214; gb = 240; }
          else if (glyph) { const q = Math.min(1, hz * 1.1); gr = lerp(gr, 190, q); gg2 = lerp(gg2, 216, q); gb = lerp(gb, 240, q); }
          frostHide = hz;
        }
      }
      fd[o] = fr; fd[o + 1] = fg; fd[o + 2] = fb; fd[o + 3] = 255;
      if (glyph) { G[i] = glyph; C[i] = pack(gr, gg2, gb); }
    }
  }

  // snow falling outside the glass
  for (const f of FLAKES) {
    const c = Math.floor((L.GX0 + f.x * L.u) / 2), r = Math.floor((L.GY0 + f.y * L.u) / 3);
    if (c < 0 || r < 0 || c >= cols || r >= rows) continue;
    const i = r * cols + c;
    if (kind[i] !== 3) continue;
    const eff = 1 - clr[i];
    if (eff > 0.01 && (frostB[i] <= fT || mist[i] * eff > 0.5)) continue;
    const o = i * 4, lum = (fd[o] * 0.3 + fd[o + 1] * 0.59 + fd[o + 2] * 0.11) / 255;
    G[i] = f.z > 0.82 ? 42 : f.z > 0.6 ? 43 : f.z > 0.4 ? 58 : 46;
    const v = 0.55 + 0.45 * f.z;
    C[i] = pack(236 * v, 244 * v, 255 * v);
  }
  // musical notes and laughter rise from the street
  for (const p of notes) {
    const c = Math.floor((L.GX0 + p.x * L.u) / 2), r = Math.floor((L.GY0 + p.y * L.u) / 3);
    if (c < 0 || r < 0 || c >= cols || r >= rows || kind[r * cols + c] !== 3) continue;
    const i = r * cols + c;
    G[i] = p.ch; const a = Math.min(1, p.life * 1.8);
    const [pr, pg, pb] = p.rgb.split(",").map(Number);
    const o = i * 4;
    C[i] = pack(lerp(fd[o], pr, a), lerp(fd[o + 1], pg, a), lerp(fd[o + 2], pb, a));
  }

  // candle and geranium stand in front of the glass
  for (const f of fgCells) {
    const o = f.i * 4, glassUnder = kind[f.i] === 3;
    const base = glassUnder ? [fd[o], fd[o + 1], fd[o + 2]] : [fd[o], fd[o + 1], fd[o + 2]];
    const mixF = 1;
    fd[o] = lerp(base[0], f.f[0], mixF); fd[o + 1] = lerp(base[1], f.f[1], mixF); fd[o + 2] = lerp(base[2], f.f[2], mixF);
    G[f.i] = f.g; C[f.i] = f.col;
  }
  const fi = L.flame.r * cols + L.flame.c;
  {
    const o = fi * 4, fr = ["(", ")", "^", "'", "!"][Math.floor(time * 11 + Math.sin(time * 5) * 3) % 5 < 0 ? 0 : Math.floor(time * 11 + Math.sin(time * 5) * 3) % 5];
    fd[o] = lerp(fd[o], 120, 0.5); fd[o + 1] = lerp(fd[o + 1], 70, 0.5); fd[o + 2] = lerp(fd[o + 2], 20, 0.5);
    G[fi] = fr.charCodeAt(0); C[fi] = pack(255, 232, 140);
  }
  // captions
  const capRow = Math.min(rows - 3, L.wy0 + L.wh + L.SILL + 2);
  const putText = (text, row, rgb, a) => {
    if (a <= 0.01 || row < 0 || row >= rows) return;
    const c0 = Math.floor((cols - text.length) / 2);
    for (let k = 0; k < text.length; k++) {
      const c = c0 + k, i = row * cols + c, ch2 = text.charCodeAt(k);
      if (c < 0 || c >= cols || ch2 === 32) continue;
      const o = i * 4;
      G[i] = ch2; C[i] = pack(lerp(fd[o], rgb[0], a), lerp(fd[o + 1], rgb[1], a), lerp(fd[o + 2], rgb[2], a));
    }
  };
  // composite
  fillCtx.putImageData(fillImg, 0, 0);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(fillC, 0, 0, cols * cw, rows * ch);
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.drawImage(gridC, 0, 0);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.font = `600 ${Math.round(ch * 0.78)}px ${L.font}`;
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  let last = "";
  for (let i = 0; i < n; i++) {
    const g = G[i];
    if (!g || g === 32) continue;
    const s = css(C[i]);
    if (s !== last) ctx.fillStyle = last = s;
    ctx.fillText(chr(g), (i % cols) * cw + cw / 2, ((i / cols) | 0) * ch + ch / 2 + ch * 0.06);
  }
  // captions use a larger font so they stay readable
  const capY = (L.wy0 + L.wh + L.SILL + 2) * ch + ch * 0.5;
  ctx.textBaseline = "middle";
  if (cap.text) {
    const t = time - cap.t0, a = Math.min(1, t / 0.6, Math.max(0, (cap.dur - t) / 0.6));
    if (a > 0.01) { ctx.font = `700 ${clamp(Math.round(L.w / 70), 13, 22)}px ${L.font}`; ctx.fillStyle = `rgba(240,218,164,${a.toFixed(3)})`; ctx.fillText(cap.text, L.w / 2, capY); }
  }
  if (time < hint.until) {
    const a = Math.min(1, (hint.until - time) / 2) * 0.75;
    ctx.font = `600 ${clamp(Math.round(L.w / 110), 11, 15)}px ${L.font}`; ctx.fillStyle = `rgba(160,186,232,${a.toFixed(3)})`;
    ctx.fillText("проведи мишею по склу, щоб розчистити іній", L.w / 2, capY + clamp(Math.round(L.w / 70), 13, 22) * 1.8);
  }
}

// ---------- boot ----------
function wipe(cx, cy, rad) {
  const { cols, rows } = L;
  for (let r = Math.max(0, Math.floor(cy - rad)); r <= Math.min(rows - 1, Math.ceil(cy + rad)); r++) {
    for (let c = Math.max(0, Math.floor(cx - rad)); c <= Math.min(cols - 1, Math.ceil(cx + rad)); c++) {
      const i = r * cols + c;
      if (kind[i] !== 3) continue;
      const d = Math.hypot(c - cx, (r - cy) * 1.5) / (rad * 1.5);
      if (d < 1) clr[i] = Math.max(clr[i], 1 - d * d * 0.7);
    }
  }
}

function setup() {
  layout();
  const { w, h, dpr, cols, rows, SW, SH, cw, ch, n } = L;
  canvas.width = Math.round(w * dpr); canvas.height = Math.round(h * dpr);
  L.font = getComputedStyle(canvas).fontFamily || "monospace";
  sceneC = mk(SW, SH); S = sceneC.getContext("2d", { willReadFrequently: true });
  fillC = mk(cols, rows); fillCtx = fillC.getContext("2d"); fillImg = fillCtx.createImageData(cols, rows);
  G = new Uint16Array(n); C = new Uint32Array(n);
  gridC = mk(canvas.width, canvas.height);
  const g = gridC.getContext("2d");
  g.strokeStyle = "rgba(255,255,255,0.05)"; g.lineWidth = 1; g.beginPath();
  for (let c = 0; c <= cols; c++) { const x = Math.round(c * cw * dpr) + 0.5; g.moveTo(x, 0); g.lineTo(x, h * dpr); }
  for (let r = 0; r <= rows; r++) { const y = Math.round(r * ch * dpr) + 0.5; g.moveTo(0, y); g.lineTo(w * dpr, y); }
  g.stroke();
  buildCells(); genFrost(); buildWorld(); bakeAll();
}

canvas = document.querySelector("canvas");
ctx = canvas.getContext("2d", { alpha: false });
setup();

const STEP = 1 / 30;
{
  const skip = Number(QS.get("t")) || 0;
  for (let k = 0; k < skip / STEP; k++) update(STEP);
}

if (QS.has("clear")) clr.fill(1);

function pointer(e) {
  const cx = e.clientX / L.cw, cy = e.clientY / L.ch;
  wipe(cx, cy, 3.6);
  hint.until = Math.min(hint.until, time + 1.5);
}
canvas.addEventListener("pointermove", pointer);
canvas.addEventListener("pointerdown", pointer);

let rto = 0;
addEventListener("resize", () => { clearTimeout(rto); rto = setTimeout(() => { setup(); render(); }, 120); });

const FPS = clamp(Number(QS.get("fps")) || 30, 5, 60);
const still = matchMedia("(prefers-reduced-motion: reduce)");
let lastT = 0, acc = 0;
function frame(now) {
  requestAnimationFrame(frame);
  if (now - lastT < 1000 / FPS - 2) return;
  const dt = Math.min(0.1, (now - lastT) / 1000);
  lastT = now; acc += dt;
  let k = 0;
  while (acc >= STEP && k < 4) { update(STEP); acc -= STEP; k++; }
  if (k === 4) acc = 0;
  render();
