<script>
"use strict";

// ---------- helpers ----------
const TAU = Math.PI * 2;
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = (t) => t * t * (3 - 2 * t);
const mix = (a, b, t) => [lerp(a[0], b[0], t), lerp(a[1], b[1], t), lerp(a[2], b[2], t)];
function hash(x, y, s) {
  let h = (Math.imul(x | 0, 374761393) + Math.imul(y | 0, 668265263) + Math.imul(s | 0, 1274126177)) | 0;
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
}
function noise2(x, y, s) {
  const xi = Math.floor(x), yi = Math.floor(y);
  const u = smooth(x - xi), v = smooth(y - yi);
  return lerp(lerp(hash(xi, yi, s), hash(xi + 1, yi, s), u), lerp(hash(xi, yi + 1, s), hash(xi + 1, yi + 1, s), u), v);
}
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const pack = (r, g, b) => (clamp(r | 0, 0, 255) << 16) | (clamp(g | 0, 0, 255) << 8) | clamp(b | 0, 0, 255);
const charCache = [];
const chr = (code) => charCache[code] || (charCache[code] = String.fromCharCode(code));
// A line drawn at this angle looks most like which character?
function dirGlyph(a) {
  a = ((a % Math.PI) + Math.PI) % Math.PI;
  if (a < Math.PI / 8 || a >= (7 * Math.PI) / 8) return 45;
  if (a < (3 * Math.PI) / 8) return 92;
  if (a < (5 * Math.PI) / 8) return 124;
  return 47;
}
const hexRgb = (h) => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
const shade = (h, k) => { const [r, g, b] = hexRgb(h); return `rgb(${(r * k) | 0},${(g * k) | 0},${(b * k) | 0})`; };
const span = (a) => a[0] + Math.random() * (a[1] - a[0]);
function mk(w, h) { const c = document.createElement("canvas"); c.width = w; c.height = h; return c; }

const RAMP = ".:;=+*#%@";          // sparse -> dense
const QS = new URLSearchParams(location.search);
if (QS.has("seed")) Math.random = mulberry32(Number(QS.get("seed")) | 0);     // repeatable runs, for testing
const SEED = (Math.random() * 1e6) | 0;
const SAVER = QS.has("saver"), ZOO = QS.has("zoo");

// ---------- state ----------
const L = {};
let canvas, ctx, S, Dc, staticS, staticD;
let kind, glassIdx, BG3, bgKind, bgG, bgC, spk, hid;
let F3, G, C, PF, PG, PC, cellJ, cellP, cellH6, cellH7;
let frostG, frostB, mist, mistB, clr;
let starG, starC, starCells = [], halo, haloCells = [];
let outImg, OUT32;
let X, D;                            // colour context and feather-direction context
let time = 0;
let BIRDS = [], MAG = null, ROWAN = null, SNAG = null, dust = [], FLAKES = [], STARS = [];

// ---------- the look ----------
const SKY = [[11, 22, 62], [33, 68, 128], [70, 104, 160]];
const HILL = [[50, 76, 124], [60, 88, 138], [72, 102, 152], [92, 122, 172]];
const GROUND = [[82, 106, 156], [96, 120, 168], [110, 134, 180], [126, 148, 192], [144, 164, 204]];
const BARK = "#3b2a24", SNOW = "#e6edf8";
const MOON = { x: 0.17, y: 14, r: 6.2 };
const farY = (x) => 66 + 3 * Math.sin(x * 0.05 + 1) + 2 * Math.sin(x * 0.11 + 2);
const nearY = (x) => 81 + 2.5 * Math.sin(x * 0.035 + 0.5) + 1.5 * Math.sin(x * 0.09 + 2.2);

// ---------- layout: a window that fills the screen ----------
function layout() {
  const dpr = Math.min(devicePixelRatio || 1, 2);
  const wD = Math.max(1, Math.round(innerWidth * dpr)), hD = Math.max(1, Math.round(innerHeight * dpr));
  const cwD = clamp(Math.round(wD / 260), 4, 16), chD = Math.round(cwD * 1.5);
  const cols = Math.ceil(wD / cwD), rows = Math.ceil(hD / chD), n = cols * rows;
  const FX = Math.max(2, Math.round(cols / 64)), FY = Math.max(1, Math.round(FX / 1.5));
  const MX = Math.max(1, Math.round(FX * 0.5)), MY = Math.max(1, Math.round(MX / 1.5));
  const gx0 = FX, gy0 = FY, gw = cols - 2 * FX, gh = rows - 2 * FY;
  const nc = wD > hD * 1.15 ? 3 : 2;
  const pwc = Math.floor((gw - (nc - 1) * MX) / nc), tr = Math.round(gh * 0.29);   // tr: the row of small upper lights
  const mcols = [], mrows = [gy0 + tr], panes = [];
  for (let k = 1; k < nc; k++) mcols.push(gx0 + k * pwc + (k - 1) * MX);
  for (let k = 0; k < nc; k++) {
    const x = gx0 + k * (pwc + MX), pw = k === nc - 1 ? gx0 + gw - x : pwc;
    panes.push({ x, y: gy0, w: pw, h: tr });
    panes.push({ x, y: gy0 + tr + MY, w: pw, h: gh - tr - MY });
  }
  Object.assign(L, { dpr, cwD, chD, cols, rows, n, FX, FY, MX, MY, gx0, gy0, gw, gh, nc, tr, mcols, mrows, panes,
    SW: cols * 2, SH: rows * 3, GX0: gx0 * 2, GY0: gy0 * 3, GW: gw * 2, GH: gh * 3 });
  L.u = L.GH / 100;                  // the world is 100 units tall
  L.Wd = L.GW / L.u;
  L.bk = clamp(L.Wd / 120, 0.55, 1);            // bird scale
  L.muntinX = mcols.map((m) => ((m + MX / 2) * 2 - L.GX0) / L.u);
  const th = (tr * 3) / L.u;
  MOON.x = 0.5 / nc; MOON.y = th * 0.5; MOON.r = Math.min(6.2, th * 0.26);
}
const setW = (c) => c.setTransform(L.u, 0, 0, L.u, L.GX0, L.GY0);

// ---------- static cells: the frame, the calm backdrop, snow drifted against the glass ----------
function buildCells() {
  const { n, cols, rows, gx0, gy0, gw, gh, MX, MY, mcols, mrows, u, GX0, GY0, Wd, panes } = L;
  kind = new Uint8Array(n); BG3 = new Uint8ClampedArray(n * 3); bgKind = new Uint8Array(n);
  bgG = new Uint16Array(n); bgC = new Uint32Array(n); spk = new Float32Array(n); hid = new Uint8Array(n);
  F3 = new Uint8ClampedArray(n * 3); G = new Uint16Array(n); C = new Uint32Array(n);
  const pane = new Int8Array(n).fill(-1);
  panes.forEach((p, k) => { for (let r = p.y; r < p.y + p.h; r++) for (let c = p.x; c < p.x + p.w; c++) pane[r * cols + c] = k; });
  const gl = [], mxw = MOON.x * Wd;
  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      const i = r * cols + c, o = i * 3;
      if (pane[i] < 0) {
        // wooden frame
        kind[i] = 1;
        const vert = c < gx0 || c >= gx0 + gw || mcols.some((m) => c >= m && c < m + MX);
        const horiz = r < gy0 || r >= gy0 + gh || mrows.some((m) => r >= m && r < m + MY);
        const outer = c === 0 || r === 0 || c === cols - 1 || r === rows - 1;
        const inner = (c > 0 && pane[i - 1] >= 0) || (c < cols - 1 && pane[i + 1] >= 0) || (r > 0 && pane[i - cols] >= 0) || (r < rows - 1 && pane[i + cols] >= 0);
        const f = outer ? [20, 11, 7] : inner ? [54, 32, 19] : [37, 21, 12], grain = hash(c, r, SEED + 60);
        F3[o] = f[0]; F3[o + 1] = f[1]; F3[o + 2] = f[2];
        G[i] = vert && horiz ? 43 : vert ? (grain < 0.1 ? 58 : 124) : grain < 0.1 ? 45 : 61;
        C[i] = outer ? pack(82, 50, 29) : inner ? pack(170, 114, 68) : pack(116, 74, 43);
        continue;
      }
      kind[i] = 3; gl.push(i);
      // backdrop: flat dithered bands, like the contour lines of a depth chart
      const wx = ((c + 0.5) * 2 - GX0) / u, wy = ((r + 0.5) * 3 - GY0) / u, h = hash(c, r, SEED + 50);
      const fy = farY(wx), ny = nearY(wx);
      let col;
      if (wy < fy) {
        const dm = Math.hypot(wx - mxw, wy - MOON.y);
        const v = clamp(wy / 70, 0, 1) + 0.5 * Math.exp(-(dm * dm) / 420);
        const q = Math.floor(v * 10 + (h - 0.5) * 0.9) / 10;
        col = q <= 1 ? mix(SKY[0], SKY[1], clamp(q, 0, 1)) : mix(SKY[1], SKY[2], clamp((q - 1) / 0.5, 0, 1));
      } else if (wy < ny) {
        bgKind[i] = 1;
        const v = 0.6 * noise2(wx * 0.07, wy * 0.22, SEED + 51) + (wy - fy < 1.5 ? 0.4 : 0);
        col = HILL[clamp(Math.floor(v * 4 + (h - 0.5) * 0.8), 0, 3)];
      } else {
        bgKind[i] = 2;
        const v = 0.45 * noise2(wx * 0.045, wy * 0.14, SEED + 52) + 0.5 * ((wy - ny) / (100 - ny)) + (wy - ny < 1.3 ? 0.3 : 0);
        col = GROUND[clamp(Math.floor(v * 5 + (h - 0.5) * 0.8), 0, 4)];
      }
      BG3[o] = col[0]; BG3[o + 1] = col[1]; BG3[o + 2] = col[2];
      if (bgKind[i] && hash(c, r, SEED + 53) < 0.012) spk[i] = 1 + hash(c, r, SEED + 54) * 40;
    }
  }
  // snow blown into the bottom corners of every pane
  for (const p of panes) {
    const hmax = clamp(p.h * 0.085, 1.6, 7), hs = [];
    for (let c = p.x; c < p.x + p.w; c++) {
      const xn = (c - p.x + 0.5) / p.w;
      hs.push(Math.max(1, Math.round(hmax * (0.14 + 0.86 * Math.pow(Math.abs(2 * xn - 1), 2.6)) * (0.75 + 0.5 * noise2(c * 0.17, p.y * 0.3, SEED + 40)))));
    }
    for (let k = 0; k < p.w; k++) {
      const c = p.x + k, hh = hs[k];
      for (let j = 0; j < hh; j++) {
        const r = p.y + p.h - 1 - j, i = r * cols + c, o = i * 3;
        bgKind[i] = 3; spk[i] = 0;
        if (j === hh - 1) {
          const l = k > 0 ? hs[k - 1] : hh, rt = k < p.w - 1 ? hs[k + 1] : hh;
          bgG[i] = l > hh ? 92 : rt > hh ? 47 : 95; bgC[i] = pack(236, 242, 254);
        } else {
          const t = j / hmax;
          BG3[o] = 162 + 30 * t; BG3[o + 1] = 180 + 26 * t; BG3[o + 2] = 214 + 18 * t;
          if (hash(c, r, SEED + 41) < 0.1) { bgG[i] = 46; bgC[i] = pack(120, 140, 180); }
        }
      }
    }
  }
  glassIdx = Uint32Array.from(gl);
}

// ---------- frost: fern-like plumes grown from the pane edges ----------
function genFrost() {
  const { n, cols } = L;
  frostG = new Uint16Array(n); frostB = new Float32Array(n).fill(1e9);
  mist = new Float32Array(n); mistB = new Float32Array(n); clr = new Float32Array(n);
  const rnd = mulberry32(SEED + 7);
  for (const p of L.panes) {
    const mn = Math.min(p.w, p.h * 1.5), delay = rnd() * 5;
    for (let r = p.y; r < p.y + p.h; r++) {
      for (let c = p.x; c < p.x + p.w; c++) {
        const i = r * cols + c;
        const dE = Math.min(c - p.x, p.x + p.w - 1 - c, (r - p.y) * 1.5, (p.y + p.h - 1 - r) * 1.5);
        const low = 0.45 + 0.55 * ((r - p.y) / p.h);
        let m = Math.pow(clamp(1 - dE / (mn * 0.085 * (0.6 + low)), 0, 1), 0.8) * (0.55 + 0.7 * noise2(c * 0.22, r * 0.15, SEED));
        m += 0.14 * ((r - p.y) / p.h) * clamp(1 - dE / (mn * 0.4), 0, 1);
        mist[i] = clamp(m, 0, 1); mistB[i] = delay + dE * 0.5;
      }
    }
    const grow = (x, y, a, len, depth, t0) => {
      let tr = 0, next = 1.4 + rnd() * 0.8;
      const curl = (rnd() - 0.5) * 0.08;
      while (tr < len) {
        x += Math.cos(a) * 0.5; y += (Math.sin(a) * 0.5) / 1.5; tr += 0.5;
        a += curl + (rnd() - 0.5) * 0.1;
        const c = Math.floor(x), r = Math.floor(y);
        if (c < p.x || c >= p.x + p.w || r < p.y || r >= p.y + p.h) break;
        const i = r * cols + c, t = t0 + tr * 0.45;
        if (t < frostB[i]) { frostB[i] = t; frostG[i] = tr > len - 0.8 && rnd() < 0.5 ? 42 : dirGlyph(a); }
        if (depth < 2 && tr > next) {
          next += 2.2 + rnd();
          const sp = 0.78 - 0.1 * depth, sl = len * (0.42 - 0.07 * depth);
          grow(x, y, a + sp, sl, depth + 1, t); grow(x, y, a - sp, sl, depth + 1, t);
        }
      }
    };
    for (let x = p.x + 4; x < p.x + p.w - 3; x += 22 + rnd() * 14) grow(x, p.y + 0.01, Math.PI / 2 + (rnd() - 0.5) * 0.8, mn * (0.04 + 0.06 * rnd()), 0, delay + rnd() * 8);
    for (let x = p.x + 3; x < p.x + p.w - 2; x += 9 + rnd() * 12) { const q = rnd(); grow(x, p.y + p.h - 0.01, -Math.PI / 2 + (rnd() - 0.5) * 0.9, mn * (0.05 + 0.26 * q * q), 0, delay + rnd() * 8); }
    for (let y = p.y + 3; y < p.y + p.h - 1; y += 11 + rnd() * 6) {
      const low = 0.35 + 0.65 * ((y - p.y) / p.h);          // longer plumes lower down
      grow(p.x + 0.01, y, (rnd() - 0.5) * 0.8, mn * (0.05 + 0.12 * rnd()) * low, 0, delay + rnd() * 8);
      grow(p.x + p.w - 0.01, y, Math.PI + (rnd() - 0.5) * 0.8, mn * (0.05 + 0.12 * rnd()) * low, 0, delay + rnd() * 8);
    }
    const corners = [[p.x, p.y, 0, 0.5, 0.1], [p.x + p.w - 0.01, p.y, 1, 0.5, 0.1], [p.x, p.y + p.h - 0.01, 3, 0.95, 0.26], [p.x + p.w - 0.01, p.y + p.h - 0.01, 2, 0.95, 0.26]];
    for (const [cx, cy, q, prob, len] of corners) {
      if (rnd() > prob) continue;
      const base = [0, Math.PI / 2, Math.PI, -Math.PI / 2][q];
      for (let k = 0; k < 6; k++) grow(cx, cy, base + 0.1 + (k / 5) * (Math.PI / 2 - 0.2), mn * (len + 0.07 * rnd()), 0, delay + 2 + rnd() * 3);
    }
  }
}

// ---------- drawing into two layers at once ----------
// X receives colour. D receives, for feathered or fibrous shapes, the direction their strokes run in,
// so that the character grid can draw them with rays the way the koi's fins are drawn.
const G2 = {
  save() { X.save(); D.save(); },
  restore() { X.restore(); D.restore(); },
  translate(x, y) { X.translate(x, y); D.translate(x, y); },
  rotate(a) { X.rotate(a); D.rotate(a); },
  scale(x, y) { X.scale(x, y); D.scale(x, y); },
  clip(build) { build(X); X.clip(); build(D); D.clip(); },
};
function dirStyle(a) {
  const m = X.getTransform(), c = Math.cos(a), s = Math.sin(a);
  const A2 = 2 * Math.atan2(m.b * c + m.d * s, m.a * c + m.c * s);
  return `rgb(${Math.round(128 + 127 * Math.cos(A2))},${Math.round(128 + 127 * Math.sin(A2))},0)`;
}
// Fill a shape. With an angle it is tagged as feathers running that way; without one it hides any tag beneath it.
function shape(build, fill, ang) {
  build(X); X.fillStyle = fill; X.fill();
  build(D);
  if (ang === undefined) { D.globalCompositeOperation = "destination-out"; D.fillStyle = "#000"; D.fill(); D.globalCompositeOperation = "source-over"; }
  else { D.fillStyle = dirStyle(ang); D.fill(); }
}
function line(x1, y1, x2, y2, w, col, tag = true) {
  for (const c of [X, D]) { c.beginPath(); c.moveTo(x1, y1); c.lineTo(x2, y2); c.lineWidth = w; c.lineCap = "round"; }
  X.strokeStyle = col; X.stroke();
  if (tag) { D.strokeStyle = dirStyle(Math.atan2(y2 - y1, x2 - x1)); D.stroke(); }
  else { D.globalCompositeOperation = "destination-out"; D.strokeStyle = "#000"; D.stroke(); D.globalCompositeOperation = "source-over"; }
}
const pPoly = (pts) => (c) => { c.beginPath(); c.moveTo(pts[0], pts[1]); for (let k = 2; k < pts.length; k += 2) c.lineTo(pts[k], pts[k + 1]); c.closePath(); };
const pEll = (x, y, rx, ry, rot = 0) => (c) => { c.beginPath(); c.ellipse(x, y, Math.max(0.01, rx), Math.max(0.01, ry), rot, 0, TAU); };

const LAT = (49 * Math.PI) / 180, EL0 = (30 * Math.PI) / 180, SKY_CY = 42, HFOV = (120 * Math.PI) / 180;
const LST0 = 3.0, LST_RATE = 0.03;    // hours of sidereal time, and hours per second (about 110x real time)

const hvOf = (m) => clamp(0.95 - 0.2 * m, 0.16, 0.9);
// Looking north from 49 degrees of latitude: the sky turns slowly around the Pole Star.
function placeStars() {
  const { cols, rows, Wd, u, GX0, GY0 } = L;
  for (let k = 0; k < starCells.length; k++) starG[starCells[k]] = 0;
  for (let k = 0; k < haloCells.length; k++) halo[haloCells[k]] = 0;
  starCells.length = 0; haloCells.length = 0;
  const lst = (LST0 + time * LST_RATE) * (Math.PI / 12);
  const sl = Math.sin(LAT), cl = Math.cos(LAT), sE = Math.sin(EL0), cE = Math.cos(EL0);
  const k = Wd / 2 / Math.tan(HFOV / 4), mx = MOON.x * Wd;
  const put = (c, r, g, R, Gc, B) => {
    if (c < 0 || r < 0 || c >= cols || r >= rows) return;
    const i = r * cols + c;
    if (kind[i] !== 3 || bgKind[i]) return;
    const col = pack(R, Gc, B);
    if (starG[i]) { if ((starC[i] & 255) >= (col & 255)) return; } else starCells.push(i);
    starG[i] = g; starC[i] = col;
  };
  const glow = (c, r, v) => {                           // a soft halo in the cells around a bright star
    if (c < 0 || r < 0 || c >= cols || r >= rows) return;
    const i = r * cols + c;
    if (kind[i] !== 3 || bgKind[i]) return;
    if (!halo[i]) haloCells.push(i);
    if (v > halo[i]) halo[i] = v;
  };
  for (const st of STARS) {
    const H = lst - st.ra, cH = Math.cos(H), sH = Math.sin(H);
    const e = -st.cd * sH, n = cl * st.sd - sl * st.cd * cH, up = sl * st.sd + cl * st.cd * cH;
    if (up < -0.02) continue;
    const d = cE * n + sE * up, yy = -sE * n + cE * up;
    if (d < -0.6) continue;
    const x = Wd / 2 + (e / (1 + d)) * k, y = SKY_CY - (yy / (1 + d)) * k;
    if (x < 0 || x > Wd || y < 0 || y > farY(x) - 1 || Math.hypot(x - mx, y - MOON.y) < MOON.r * 1.3) continue;
    const c = Math.floor((GX0 + x * u) / 2), r = Math.floor((GY0 + y * u) / 3);
    // every star twinkles at its own pace; the brighter ones carry a halo and flash their rays
    const m = st.mag, [R, Gc, B] = st.rgb;
    const tw = 0.76 + 0.24 * Math.sin(time * (1.7 + (st.k % 5) * 0.45) + st.ph), a = clamp(1.2 - 0.05 * m, 0.92, 1) * tw;
    put(c, r, m < 2.7 ? 0x2726 : m < 3.5 ? 42 : 43, R * a, Gc * a, B * a);
    const hv = hvOf(m) * tw;
    glow(c, r, hv);
    if (m < 2.7) for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) if (dx || dy) glow(c + dx, r + dy, hv * (dx && dy ? 0.3 : 0.55));
    if (m < 2.7) {
      const sparkle = 0.5 + 0.5 * Math.sin(time * 2.3 + st.ph * 3), q = (m < 1.5 ? 0.85 : 0.6) * a * (0.6 + 0.4 * sparkle);
      put(c - 1, r, 45, R * q, Gc * q, B * q); put(c + 1, r, 45, R * q, Gc * q, B * q);
      put(c, r - 1, 124, R * q, Gc * q, B * q); put(c, r + 1, 124, R * q, Gc * q, B * q);
      if (m < 1.5 && sparkle > 0.25) {                   // a cell is taller than it is wide, so two cells sideways balance one upward
        const q2 = 0.55 * a * sparkle;
        put(c - 2, r, 45, R * q2, Gc * q2, B * q2); put(c + 2, r, 45, R * q2, Gc * q2, B * q2);
        glow(c - 2, r, hv * 0.3 * sparkle); glow(c + 2, r, hv * 0.3 * sparkle);
      }
    }
  }
}

// ---------- things that never move: the moon and the spruces on the far ridge ----------
function spruce(cx, by, h, rnd) {
  const n = 7, w = h * 0.3;
  line(cx, by + 0.3, cx, by - h * 0.12, Math.max(0.5, w * 0.11), "#2b1c14");
  for (let k = 0; k < n; k++) {
    const t = k / (n - 1), yb = by - h * 0.08 - t * h * 0.8, tw = w * (1 - t * 0.86) * (0.9 + 0.2 * rnd());
    const th = (h / n) * 1.55 * (1 - t * 0.2), yt = yb - th;
    shape(pPoly([cx, yt, cx - tw, yb, cx, yb - th * 0.22]), "#1d4a40", Math.atan2(th, -tw));    // boughs droop outward: / on the left
    shape(pPoly([cx, yt, cx + tw, yb, cx, yb - th * 0.22]), "#12342e", Math.atan2(th, tw));     // and \ on the right
    shape(pPoly([cx, yt - 0.15, cx - tw * 0.62, yt + th * 0.6, cx, yt + th * 0.42]), "#e4ecf8", Math.atan2(th, -tw));
    shape(pPoly([cx, yt - 0.15, cx + tw * 0.62, yt + th * 0.6, cx, yt + th * 0.42]), "#bccbe4", Math.atan2(th, tw));
  }
}

function bakeStatic() {
  const { SW, SH, Wd } = L;
  staticS = mk(SW, SH); staticD = mk(SW, SH);
  X = staticS.getContext("2d"); D = staticD.getContext("2d"); setW(X); setW(D);
  // a young crescent, lit from the lower right, with a hint of earthshine on the rest of the disc
  const mx = MOON.x * Wd, my = MOON.y, R = MOON.r;
  shape(pEll(mx, my, R, R), "rgba(96,118,170,0.16)");
  G2.save(); G2.translate(mx, my); G2.rotate(0.42);
  shape((c) => { c.beginPath(); c.arc(0, 0, R, -Math.PI / 2, Math.PI / 2); c.ellipse(0, 0, R * 0.5, R, 0, Math.PI / 2, -Math.PI / 2, true); c.closePath(); }, "#f6f1d8");
  G2.restore();
  const rnd = mulberry32(SEED + 5);
  for (const [fx, sc] of [[0.045, 1], [0.1, 0.72], [0.29, 0.92], [0.345, 0.6], [0.56, 0.8], [0.9, 0.7]]) {
    const x = fx * Wd;
    spruce(x, farY(x) + 1.5, (16 + 6 * rnd()) * sc, rnd);
  }
}

// ---------- branches: they bend under a landing bird and spring back ----------
function makeRowan() {
  const Wd = L.Wd, rnd = mulberry32(SEED + 31), N = 40, st = [];
  const x0 = Wd + 9, x1 = (L.nc === 3 ? 0.42 : 0.56) * Wd;
  for (let k = 0; k <= N; k++) {
    const t = k / N;
    st.push({ t, x: lerp(x0, x1, t), y: 43 + 17 * Math.pow(t, 1.3) - 2.2 * Math.sin(t * Math.PI), w: lerp(3.0, 0.7, Math.pow(t, 0.75)), sn: 0.5 + 0.9 * rnd() });
  }
  const B = { stem: st, twigs: [], clusters: [], perches: [], defl: 0, vel: 0, k: 60, c: 5, soft: 1.1 };
  const blocked = new Set(), nT = clamp(Math.round((x0 - x1) / 10.5), 4, 11);
  for (let k = 0; k <= nT; k++) {
    const last = k === nT, up = k % 2 === 0 && !last;
    const i = last ? N : Math.round(lerp(0.08, 0.93, (k + 0.25 + 0.5 * rnd()) / nT) * N);
    const a = last ? Math.PI + 0.25 : Math.PI + (up ? 1 : -1) * (0.75 + 0.35 * rnd());      // toward the tip, and up or down
    const tl = last ? 3 : (6.5 + 4.5 * rnd()) * (1 - 0.35 * st[i].t), pts = [];
    for (let j = 0; j <= 4; j++) { const f = j / 4; pts.push([Math.cos(a) * tl * f, Math.sin(a) * tl * f + 1.3 * f * f]); }
    const tw = { i, pts, w: Math.max(0.45, st[i].w * 0.42), end: pts[4] };
    B.twigs.push(tw);
    if (up) blocked.add(i);
    // a corymb of berries hangs from the end of the twig
    const berries = [], nb = 9 + ((rnd() * 7) | 0);
    for (let q = 0; q < nb; q++) {
      const an = rnd() * TAU, d = Math.sqrt(rnd());
      berries.push({ x: -0.3 + Math.cos(an) * d * 2.4, y: 2.0 + Math.sin(an) * d * 1.6, r: 0.62 + 0.25 * rnd(), col: ["#d83a22", "#d83a22", "#ec5a30", "#b22a1c"][(rnd() * 4) | 0] });
    }
    B.clusters.push({ tw, berries, ph: rnd() * TAU });
  }
  let lastX = 1e9;
  const bar = ((L.tr + L.MY) * 3) / L.u;
  for (let i = 3; i < N; i++) {
    const x = st[i].x;
    if (x > Wd - 13 * L.bk || x < 4 || blocked.has(i) || lastX - x < 21 * L.bk || st[i].y - 13 * L.bk < bar || L.muntinX.some((m) => Math.abs(m - x) < 6 * L.bk)) continue;
    B.perches.push({ i, x, B, taken: null }); lastX = x;
  }
  return B;
}

function makeSnag() {
  const Wd = L.Wd, rnd = mulberry32(SEED + 77), N = 18, st = [], x1 = L.nc === 3 ? Math.min(0.27 * Wd, 46) : 0.44 * Wd;
  for (let k = 0; k <= N; k++) {
    const t = k / N;
    st.push({ t, x: lerp(-9, x1, t), y: 47 + 4.5 * t - 1.8 * Math.sin(t * Math.PI), w: lerp(2.6, 0.6, Math.pow(t, 0.8)), sn: 0.5 + 0.9 * rnd() });
  }
  const B = { stem: st, twigs: [], clusters: [], perches: [], defl: 0, vel: 0, k: 80, c: 7, soft: 0.45 };
  for (const [f, a, tl] of [[0.42, -0.95, 7], [0.82, 0.75, 4]]) {
    const i = Math.round(f * N), pts = [];
    for (let j = 0; j <= 4; j++) { const q = j / 4; pts.push([Math.cos(a) * tl * q, Math.sin(a) * tl * q + 0.8 * q * q]); }
    B.twigs.push({ i, pts, w: Math.max(0.4, st[i].w * 0.4), end: pts[4] });
  }
  let best = 0;
  for (let i = 0; i <= N; i++) if (Math.abs(st[i].x - x1 * 0.64) < Math.abs(st[best].x - x1 * 0.64)) best = i;
  B.perches.push({ i: best, x: st[best].x, B, taken: null });
  return B;
}

function updateBranch(B, dt) {
  let load = 0;
  for (const p of B.perches) if (p.taken && p.taken.mode === "sit") load += p.taken.sp.weight * B.stem[p.i].t ** 2;
  if (B === ROWAN && SQ.mode !== "away") load += SQ.sp.weight * (SQ.f / (B.stem.length - 1)) ** 2;
  B.vel += (-B.k * (B.defl - load * B.soft) - B.c * B.vel) * dt;
  B.defl += B.vel * dt;
}
function perchXY(p) { const s = p.B.stem[p.i]; return [s.x, s.y + p.B.defl * s.t * s.t - s.w * 0.5 - 0.3]; }

function drawBranch(B) {
  const st = B.stem, d = B.defl, py = (i) => st[i].y + d * st[i].t * st[i].t;
  for (const tw of B.twigs) {
    const bx = st[tw.i].x, by = py(tw.i);
    for (let j = 1; j < tw.pts.length; j++) line(bx + tw.pts[j - 1][0], by + tw.pts[j - 1][1], bx + tw.pts[j][0], by + tw.pts[j][1], lerp(tw.w, tw.w * 0.5, j / 4), BARK);
  }
  for (let i = 0; i < st.length - 1; i++) line(st[i].x, py(i), st[i + 1].x, py(i + 1), st[i].w, BARK);
  for (let i = 0; i < st.length - 1; i++) {
    line(st[i].x, py(i) - st[i].w * 0.5, st[i + 1].x, py(i + 1) - st[i + 1].w * 0.5, Math.max(0.45, st[i].w * 0.42 * st[i].sn), SNOW, false);
  }
  for (const cl of B.clusters) {
    const tw = cl.tw, ex = st[tw.i].x + tw.end[0] + 0.22 * Math.sin(time * 0.8 + cl.ph) + B.vel * 0.05, ey = py(tw.i) + tw.end[1];
    for (let q = 0; q < cl.berries.length; q += 4) line(ex - tw.end[0] * 0.02, ey, ex + cl.berries[q].x, ey + cl.berries[q].y, 0.22, BARK);
    for (const b of cl.berries) shape(pEll(ex + b.x, ey + b.y, b.r, b.r), b.col);
    shape(pEll(ex - 0.3, ey + 0.55, 2.1, 0.6), SNOW);
  }
}

    line(H[0] - 0.45, H[1] + 0.82, H[0] + 0.75, H[1] + 0.85, 0.3, sp.dark, false);

  sparrow(H, r, sp) {                                  // grey crown, chestnut behind the eye, black bib
    shape(pEll(H[0] - 0.05, H[1] - 0.78, r * 1.1, r * 0.5), sp.cap);
    shape(pEll(H[0] - 0.6, H[1] - 0.15, 0.78, 0.5), sp.nape);
    if (sp.bib) { shape(pEll(H[0] + 0.6, H[1] + 0.85, 0.7, 0.5), sp.bib); line(H[0] + r, H[1] - 0.1, H[0] + 0.3, H[1] - 0.2, 0.2, sp.bib, false); }
  },
  magpie() {},
};

// One wingbeat: a quick power stroke down, then a slower recovery with the wing half folded.
function wingStroke(p, up, down) {
  if (p < 0.45) return [lerp(up, -down, smooth(p / 0.45)), 1];
  const e = smooth((p - 0.45) / 0.55);
  return [lerp(-down, up, e), 1 - 0.32 * Math.sin(Math.PI * e)];
}

// A wing seen from the side: it does not swing like an oar, it rises above the shoulder and drops below it,
// and is almost edge-on as it passes the level of the back. th is the stroke angle, positive when raised.
function flightWing(sp, th, sp2, far) {
  const ky = sp.plump, Sx = 0.75, Sy = -0.8 * ky, Lw = sp.wingL * sp2, h = Lw * Math.sin(th);
  const upper = far ? th > 0 : th <= 0;                // which surface of this wing faces us
  const col = far ? (upper ? sp.wingFar : sp.wingUnderFar) : upper ? sp.wing : sp.wingUnder;
  const ox = far ? 0.5 : 0, oy = far ? -0.1 : 0;
  const r1x = Sx + 0.65 + ox, r1y = Sy + 0.25 + oy, r2x = Sx - 1.9 + ox, r2y = Sy + 0.6 + oy;
  if (Math.abs(h) < 0.5) { shape(pEll((r1x + r2x) / 2 - 0.5, (r1y + r2y) / 2 - h * 0.5, 1.9, 0.3, 0.1), col, 0); return; }
  const tx = Sx - 0.9 - 0.5 * Math.cos(th) + ox, ty = Sy - h + oy, mx = (r1x + r2x) / 2, my = (r1y + r2y) / 2;
  const wing = (c) => { c.beginPath(); c.moveTo(r1x, r1y); c.quadraticCurveTo(r1x + 0.15, Sy - h * 0.75 + oy, tx, ty); c.quadraticCurveTo(r2x - 0.8, Sy - h * 0.5 + oy, r2x, r2y); c.closePath(); };
  const wa = Math.atan2(ty - my, tx - mx);
  shape(wing, col, wa);
  G2.save(); G2.clip(wing);
  if (sp.wingPrim) shape(pEll(lerp(mx, tx, 0.6), lerp(my, ty, 0.6), Math.hypot(tx - mx, ty - my) * 0.3, 0.8, wa), far ? sp.wingPrimFar : sp.wingPrim, wa);
  else if (upper && !far && sp.wingBar) shape(pEll(lerp(mx, tx, 0.34), lerp(my, ty, 0.34), 0.24, 1.2, wa), sp.wingBar, wa);
  G2.restore();
}

function drawBird(b) {
  const sp = b.sp, ky = sp.plump, fly = b.mode === "fly", fl = b.flare || 0, hr = sp.headR;
  const z = b.s * (1 + 0.07 * (b.fluff || 0));
  G2.save(); G2.translate(b.x, b.y); G2.scale(b.dir * z, z);
  if (!fly) {                                          // legs gripping the perch
    const ly = sp.legY;
    line(-0.4, 0.9 * ky, -0.3, ly, 0.24, sp.leg); line(0.3, 0.95 * ky, 0.4, ly, 0.24, sp.leg);
    line(-0.75, ly, 0.15, ly, 0.24, sp.leg); line(-0.05, ly, 0.85, ly, 0.24, sp.leg);
  }
  G2.rotate(b.pitch);
  if (fly && fl > 0.05) {                              // legs reach for the branch
    line(0.4, 1.0 * ky, 0.4 + fl, 1.2 * ky + 0.9 * fl, 0.24, sp.leg); line(-0.1, 1.1 * ky, -0.1 + fl, 1.3 * ky + 0.9 * fl, 0.24, sp.leg);
  }
  const flap = fly && b.wingP >= 0, glide = fly && b.wingP === -2;
  let th = 0.14, sp2 = 1;
  if (flap) [th, sp2] = wingStroke(b.wingP, fl > 0 ? 1.25 : 1.15, fl > 0 ? 0.7 : 0.9);
  if (flap || glide) flightWing(sp, th, sp2, true);

  // tail
  G2.save(); G2.translate(-1.8, 0.1 * ky); G2.rotate(b.tailAng || 0);
  const TL = sp.TL, fan = b.tailFan || 0, e = 0.5 + 0.85 * fan;
  const tp = sp.wedge ? [0, -0.5, -TL * 0.45, -(0.85 + 0.5 * fan), -TL, -0.22, -TL, 0.22, -TL * 0.45, 0.85 + 0.5 * fan, 0, 0.5]
    : sp.notch ? [0, -0.5, -TL, -e, -TL + 0.45, 0, -TL, e, 0, 0.5] : [0, -0.5, -TL, -e, -TL - 0.12, 0, -TL, e, 0, 0.5];
  shape(pPoly(tp), sp.tail, 0);
  if (sp.tailGloss) shape(pPoly([-0.4, -0.3, -TL * 0.5, -0.45, -TL * 0.92, -0.1, -TL * 0.92, 0.1, -TL * 0.5, 0.2, -0.4, 0.15]), sp.tailGloss, 0);
  G2.restore();

  // body: an egg, with the back, breast and vent painted inside it
  const body = (c) => {
    c.beginPath(); c.moveTo(-2.15, 0.05 * ky);
    c.bezierCurveTo(-2.0, -1.2 * ky, -0.5, -1.7 * ky, 0.9, -1.5 * ky);
    c.bezierCurveTo(1.9, -1.3 * ky, 2.45, -0.6 * ky, 2.3, 0.15 * ky);
    c.bezierCurveTo(2.15, 1.05 * ky, 1.2, 1.6 * ky, 0.0, 1.55 * ky);
    c.bezierCurveTo(-1.0, 1.5 * ky, -1.95, 1.0 * ky, -2.15, 0.05 * ky); c.closePath();
  };
  shape(body, sp.under);
  G2.save(); G2.clip(body);
  if (sp.breast) { const q = sp.breastE; shape(pEll(q[0], q[1] * ky, q[2], q[3] * ky), sp.breast); }
  if (sp.vent) { const q = sp.ventE || [-1.3, 1.25, 1.5, 0.75]; shape(pEll(q[0], q[1] * ky, q[2], q[3] * ky), sp.vent); }
  shape(pEll(-0.75, -1.8 * ky, 3.3, 1.9 * ky, 0.1), sp.back);
  if (sp.streaks) for (let k = 0; k < 4; k++) line(0.6 - k * 0.75, -1.35 * ky, 0.05 - k * 0.75, -0.55 * ky, 0.2, sp.streaks, false);
  if (sp.bib) shape(pEll(1.75, -0.35 * ky, 0.7, 0.9 * ky), sp.bib);
  if (sp.stripe) line(1.55, 0.4 * ky, 0.3, 1.45 * ky, 0.28, sp.stripe, false);
  if (fly && sp.rump) shape(pEll(-1.8, -0.5 * ky, 0.75, 0.6 * ky), sp.rump);
  shape(pEll(-0.2, 2.0 * ky, 2.8, 0.95 * ky), "rgba(6,10,30,0.3)");     // the belly falls into shadow
  G2.restore();

  // folded wing lying along the flank
  if (!flap && !glide) {
    const fw = (c) => {
      c.beginPath(); c.moveTo(0.95, -0.6 * ky);
      c.bezierCurveTo(0.3, -1.3 * ky, -1.2, -1.05 * ky, -2.85, 0.3 * ky);
      c.bezierCurveTo(-1.9, 0.8 * ky, -0.6, 0.85 * ky, 0.45, 0.5 * ky);
      c.bezierCurveTo(0.85, 0.25 * ky, 1.05, -0.2 * ky, 0.95, -0.6 * ky); c.closePath();
    };
    const wa = Math.atan2(0.9 * ky, -3.8);
    shape(fw, sp.wing, wa);
    G2.save(); G2.clip(fw);
    if (sp.wingBar) { const w = sp.barW; shape(pPoly([0.05, -1.3 * ky, 0.05 - w, -1.3 * ky, -0.5 - w, 1.0 * ky, -0.5, 1.0 * ky]), sp.wingBar, wa); }
    if (sp.streaks) { line(-0.9, -0.5 * ky, -2.4, 0.25 * ky, 0.2, sp.streaks, false); line(-0.6, 0.1 * ky, -2.0, 0.55 * ky, 0.2, sp.streaks, false); }
    G2.restore();
    if (sp.scap) shape(pEll(-0.1, -0.85 * ky, 1.55, 0.5 * ky, 0.22), sp.scap);
  }

  // head, bill, eye
  const H = fly ? [2.4, -0.55 * ky] : [1.8, -1.2 * ky];
  const head = pEll(H[0], H[1], hr, hr);
  shape(head, sp.cheek);
  G2.save(); G2.clip(head); HEADS[sp.head](H, hr, sp); G2.restore();
  const bl = sp.bill[0], bh = sp.bill[1];
  shape(pPoly([H[0] + hr * 0.8, H[1] - bh + 0.05, H[0] + hr + bl, H[1] + 0.12, H[0] + hr * 0.8, H[1] + bh + 0.15]), sp.billCol, 0);
  const ex = H[0] + 0.42, ey = H[1] - 0.2, m = X.getTransform();
  b.eye = [m.a * ex + m.c * ey + m.e, m.b * ex + m.d * ey + m.f];

  if (flap || glide) flightWing(sp, th, sp2, false);
  G2.restore();
}

// ---------- birds: behaviour ----------
function newBird(name, wait) {
  const sp = SPEC[name];
  return { sp, s: sp.s * (L.bk || 1) * (0.96 + 0.08 * Math.random()), x: -60, y: -60, dir: 1, mode: "away", t: 0, wait, pitch: 0, wingP: -1, beat: Math.random(), flare: 0,
    tailAng: 0, tailFan: 0, peck: 0, turn: 0, flick: 0, hopY: 0, fluff: 0, fluffT: 0, perch: null, sitLeft: 0, scared: false, panic: false, eye: null,
    ft: 0, dur: 1, kf: "land", p0: null, p1: null, p2: null, p3: null, so: 0, sv: 0, ho: 0, hv: 0 };
}

function spawnPoint(b) {
  const Wd = L.Wd, r = Math.random();
  if (b === MAG) return [-24, 14 + Math.random() * 24];
  return r < 0.4 ? [-16, 4 + Math.random() * 40] : r < 0.9 ? [Wd + 16, 2 + Math.random() * 32] : [Wd * (0.25 + 0.6 * Math.random()), -14];
}
const seat = (b, p) => { const q = perchXY(p); return [q[0], q[1] - b.sp.legY * b.s]; };

function freePerch(b) {
  if (b === MAG) { const p = SNAG.perches[0]; return p && !p.taken ? p : null; }
  if (SQ.mode !== "away") return null;
  const f = ROWAN.perches.filter((p) => !p.taken);
  if (f.length < Math.min(2, ROWAN.perches.length)) return null;
  const mates = BIRDS.filter((m) => m !== b && m.sp.flock === b.sp.flock && m.perch);
  if (mates.length && Math.random() < 0.75) {
    const mx = mates[(Math.random() * mates.length) | 0].perch.x;
    return f.reduce((best, p) => (Math.abs(p.x - mx) < Math.abs(best.x - mx) ? p : best));
  }
  return f[(Math.random() * f.length) | 0];
}

function launch(b, to, kf) {
  const dx = to[0] - b.x, dy = to[1] - b.y, dist = Math.hypot(dx, dy), sg = dx >= 0 ? 1 : -1;
  b.mode = "fly"; b.ft = 0; b.so = b.sv = b.ho = b.hv = 0; b.kf = kf; b.p0 = [b.x, b.y]; b.p3 = to; b.dir = sg; b.peck = 0; b.turn = 0; b.hopY = 0;
  if (kf === "land") {                                 // swoop in below the perch and rise onto it
    b.p1 = [b.x + dx * 0.45, b.y + dy * 0.3 - 3]; b.p2 = [to[0] - sg * Math.min(10, dist * 0.3), to[1] + Math.min(5, dist * 0.15)];
    b.dur = clamp(dist / b.sp.speed, 1.0, 4.5);
  } else if (kf === "hop") {
    b.p1 = [b.x + dx * 0.25, b.y - 4.5]; b.p2 = [to[0] - dx * 0.25, to[1] - 4.5]; b.dur = 0.5 + dist * 0.012;
  } else {
    b.p1 = [b.x + sg * 5, b.y - 8]; b.p2 = [to[0] - dx * 0.35, to[1] - dy * 0.3 + 4];
    b.dur = clamp(dist / (b.sp.speed * (b.scared ? 1.5 : 1.1)), 0.9, 4);
  }
}

function snowDust(x, y, n) {
  for (let k = 0; k < n; k++) dust.push({ x: x + (Math.random() - 0.5) * 5, y: y + Math.random(), vx: (Math.random() - 0.5) * 3, vy: Math.random() * 2, life: 1, ch: [46, 46, 58, 42, 39][(Math.random() * 5) | 0] });
}

function leave(b) {
  const sp = b.sp, p = b.perch, t = p.B.stem[p.i].t, q = perchXY(p);
  p.taken = null; b.perch = null; b.scared = b.panic; b.panic = false;
  p.B.vel += 3 * sp.weight * t * t; snowDust(q[0], q[1], 4 + sp.weight * 2);
  launch(b, spawnPoint(b), "leave");
  for (const m of BIRDS) if (m !== b && m.sp.flock === sp.flock && m.mode === "sit") m.sitLeft = Math.min(m.sitLeft, 0.3 + Math.random() * 1.6);
}

// Where the wings are at flight time t: a burst of whole wingbeats, then a pause with them shut (or held out, gliding).
function wingPhase(sp, t) {
  const cyc = (t / sp.boundT) % 1;
  if (cyc < sp.ff) return ((cyc / sp.ff) * sp.beats) % 1;
  return sp.glide ? -2 : -1;
}

function flightStep(b, dt) {
  const sp = b.sp, kf = b.kf, t0 = b.ft;
  b.ft += dt;
  const tau = Math.min(1, b.ft / b.dur);
  const u = kf === "land" ? 1 - Math.pow(1 - tau, 1.8) : kf === "hop" ? smooth(tau) : Math.pow(tau, 1.5);
  const v = 1 - u, p0 = b.p0, p1 = b.p1, p2 = b.p2, p3 = b.p3;
  let nx = v * v * v * p0[0] + 3 * v * v * u * p1[0] + 3 * v * u * u * p2[0] + u * u * u * p3[0];
  let ny = v * v * v * p0[1] + 3 * v * v * u * p1[1] + 3 * v * u * u * p2[1] + u * u * u * p3[1];
  let tx = 3 * v * v * (p1[0] - p0[0]) + 6 * v * u * (p2[0] - p1[0]) + 3 * u * u * (p3[0] - p2[0]);
  let ty = 3 * v * v * (p1[1] - p0[1]) + 6 * v * u * (p2[1] - p1[1]) + 3 * u * u * (p3[1] - p2[1]);
  const tl = Math.hypot(tx, ty) || 1;
  tx /= tl; ty /= tl;
  const landing = kf !== "leave";
  const flare = landing ? smooth(clamp((tau - (kf === "hop" ? 0.5 : 0.8)) / (kf === "hop" ? 0.45 : 0.18), 0, 1)) : 0;
  const cruise = kf !== "hop" && flare === 0;
  // Each downstroke kicks the bird forward and up; between strokes, and with the wings shut, it coasts, slows and sinks.
  // so/ho are how far that has carried it ahead of and above the smooth line it is following.
  const N = 4, h = dt / N;
  for (let k = 0; k < N; k++) {
    const ph = cruise ? wingPhase(sp, t0 + (k + 0.5) * h) : -3;
    const fF = ph === -3 ? 0 : (ph >= 0 && ph < 0.45 ? 1 : 0) - sp.meanF;
    const fL = ph === -3 ? 0 : (ph >= 0 && ph < 0.45 ? 1 : ph === -2 ? sp.glideL : 0) - sp.meanL;
    b.sv += (sp.TH * fF - 1.2 * b.sv - 5 * b.so) * h; b.so += b.sv * h;
    b.hv += (sp.LF * fL - 1.2 * b.hv - 5 * b.ho) * h; b.ho += b.hv * h;
  }
  // the bounding fades out well before the perch, so the bird steadies on its approach and never slides backwards
  const env = kf === "hop" ? 0 : smooth(clamp(Math.min(b.ft / 0.35, landing ? (0.8 - tau) / 0.3 : (b.dur - b.ft) / 0.6), 0, 1));
  nx += tx * b.so * env; ny += ty * b.so * env - b.ho * env;
  const vx = (nx - b.x) / dt, vy = (ny - b.y) / dt;
  b.x = nx; b.y = ny;
  if (cruise) b.wingP = wingPhase(sp, b.ft);
  else { b.beat += dt * sp.hz * 1.25; b.wingP = b.beat % 1; }
  const want = lerp(clamp(0.75 * Math.atan2(vy, Math.abs(vx) + 1e-3), -0.5, 0.5), -0.95, flare);
  b.pitch += (want - b.pitch) * Math.min(1, dt * 12);
  b.flare = flare; b.tailFan = flare; b.tailAng = -0.35 * flare;
  if (tau < 1) return;
  b.flare = 0; b.tailFan = 0; b.wingP = -1;
  if (landing) {
    const p = b.perch, t = p.B.stem[p.i].t, q = perchXY(p);
    b.mode = "sit"; p.B.vel += 5 * sp.weight * t * t; snowDust(q[0], q[1], 4 + sp.weight * 3);
    if (b === MAG) for (const m of BIRDS) if (m.mode === "sit" && (m.sp.flock !== "bullfinch" || Math.random() < 0.35)) { m.sitLeft = Math.min(m.sitLeft, Math.random() * 0.5); m.panic = true; }
  } else {
    b.mode = "away"; b.t = 0;
    b.wait = b === MAG ? (QS.has("mag") ? 9 : span(sp.away)) : b.scared ? 12 + Math.random() * 14 : ZOO ? 2 : span(sp.away);
    b.scared = false;
  }
}

function updateBird(b, dt) {
  const sp = b.sp;
  if (b.mode === "away") {
    b.t += dt;
    if (b.t < b.wait) return;
    if (b !== MAG && MAG.mode !== "away" && sp.flock !== "bullfinch") { b.t = 0; b.wait = 2 + Math.random() * 3; return; }
    const p = freePerch(b);
    if (!p) { b.t = 0; b.wait = 1.5 + Math.random() * 3; return; }
    const from = spawnPoint(b);
    b.x = from[0]; b.y = from[1]; b.pitch = 0; b.perch = p; p.taken = b;
    b.sitLeft = ZOO ? 90 : span(sp.stay);
    launch(b, seat(b, p), "land");
    for (const m of BIRDS) if (m !== b && m.sp.flock === sp.flock && m.mode === "away") m.wait = Math.min(m.wait, m.t + 0.5 + Math.random() * 2.2);
    return;
  }
  if (b.mode === "fly") { flightStep(b, dt); return; }

  // perched: peck, look the other way, flick the tail, hop along the branch
  let want = sp.perchPitch;
  if (b.peck > 0) { b.peck += dt / 0.42; if (b.peck >= 1) b.peck = 0; else want += 0.85 * Math.sin(Math.PI * b.peck); }
  if (b.turn > 0) {
    const k0 = b.turn; b.turn += dt / 0.18;
    if (k0 < 0.5 && b.turn >= 0.5) b.dir = -b.dir;
    if (b.turn >= 1) b.turn = 0;
    b.hopY = b.turn > 0 ? 0.9 * Math.sin(Math.PI * b.turn) : 0;
  }
  if (b.flick > 0) { b.flick += dt / 0.3; if (b.flick >= 1) b.flick = 0; }
  b.tailAng = -0.08 + (b.flick > 0 ? sp.flickA * Math.sin(Math.PI * b.flick) : 0);
  b.pitch += (want - b.pitch) * Math.min(1, dt * 14);
  if (b.fluffT > 0) b.fluffT -= dt;
  b.fluff += ((b.fluffT > 0 ? 1 : 0) - b.fluff) * Math.min(1, dt * 2);
  const q = seat(b, b.perch);
  b.x = q[0]; b.y = q[1] - b.hopY;
  b.sitLeft -= dt;
  if (b.sitLeft <= 0) { leave(b); return; }
  if (b.peck === 0 && b.turn === 0) {
    const r = Math.random() / dt;
    if (r < sp.peck) b.peck = 1e-4;
    else if (r < sp.peck + sp.turn) b.turn = 1e-4;
    else if (r < sp.peck + sp.turn + sp.flick) b.flick = 1e-4;
    else if (r < sp.peck + sp.turn + sp.flick + sp.hop) {
      const B = b.perch.B, here = b.perch.x, opts = B.perches.filter((p) => !p.taken && Math.abs(p.x - here) < 27);
      if (opts.length) {
        const p = opts[(Math.random() * opts.length) | 0], t = B.stem[b.perch.i].t;
        B.vel += 2 * sp.weight * t * t;
        b.perch.taken = null; b.perch = p; p.taken = b;
        launch(b, seat(b, p), "hop");
      }
    } else if (r < sp.peck + sp.turn + sp.flick + sp.hop + 0.03) b.fluffT = 1.5 + Math.random() * 2.5;
  }
}

// ---------- the squirrel ----------
// Drawn facing +x with its feet on y = 0. Two poses: on all fours (running or frozen, alert), and sitting up with a berry.
const SQC = { fur: "#b5561f", furD: "#96461a", belly: "#f2e2c6", tail: "#bd5a1e", tailTip: "#dc8a48", ear: "#8a3c12", tuft: "#4a1e08", paw: "#8a4016", nose: "#2e160c", berry: "#d83a22" };
const SQ = { sp: { eye: [10, 10, 14], weight: 3.5 }, mode: "away", t: 0, wait: 0, f: 0, dir: -1, ph: 0, gait: 0, pose: "run", pitch: 0, x: -99, y: -99, s: 2.25, target: 0, burst: 0, hold: 0, sitT: 0, eye: null };

// A bushy tail: fur laid along a smooth curve through the given points, widest past the middle.
function plume(pts, widths) {
  const n = pts.length - 1, N = 16, at = (u) => {
    const i = Math.min(n - 1, Math.floor(u)), f = u - i;
    const p0 = pts[Math.max(0, i - 1)], p1 = pts[i], p2 = pts[i + 1], p3 = pts[Math.min(n, i + 2)];
    const q = (a, b, c, d) => 0.5 * (2 * b + (c - a) * f + (2 * a - 5 * b + 4 * c - d) * f * f + (3 * b - a - 3 * c + d) * f * f * f);
    return [q(p0[0], p1[0], p2[0], p3[0]), q(p0[1], p1[1], p2[1], p3[1])];
  };
  let prev = at(0);
  for (let k = 1; k <= N; k++) {
    const u = (k / N) * n, p = at(u), i = Math.min(n - 1, Math.floor(u)), f = u - i;
    const ang = Math.atan2(p[1] - prev[1], p[0] - prev[0]), seg = Math.hypot(p[0] - prev[0], p[1] - prev[1]);
    shape(pEll((p[0] + prev[0]) / 2, (p[1] + prev[1]) / 2, seg * 0.95 + 0.2, lerp(widths[i], widths[i + 1], f), ang), k > N * 0.72 ? SQC.tailTip : SQC.tail, ang);
    prev = p;
  }
}

function squirrelHead(hx, hy, q) {

function drawSquirrel(q) {

  if (q.pose === "sit") {

      k.bezierCurveTo(2.0, -3.6, 2.3, -2.0, 1.6, -0.7); k.bezierCurveTo(0.6, -0.4, -0.9, -0.4, -1.7, -0.9); k.closePath();
    };

    shape(pEll(0.1, -1.7, 1.8, 1.5, 0.15), c.furD, 1.2);                          // haunch
    squirrelHead(1.45, -7.05 + nib * 0.5, q);
    line(0.9, -5.0, 1.9, -4.3, 0.65, c.fur); line(1.9, -4.3, 2.65, -5.3 + nib, 0.55, c.paw);   // arm up to the mouth
    shape(pEll(2.95, -5.55 + nib, 0.5, 0.5), c.berry);
  } else {

    line(1.5, -2.0, 2.0 - fx, -0.3, 0.5, c.furD); line(-2.6 - hx2, -0.3, -1.0 - hx2, -0.25, 0.5, c.furD);    // far legs
    const body = (k) => {
      k.beginPath(); k.moveTo(-3.3, -2.2);
      k.bezierCurveTo(-3.2, -4.0 - arch, -0.8, -4.4 - arch, 1.4, -3.7); k.bezierCurveTo(2.4, -3.4, 2.9, -2.6, 2.6, -1.8);
      k.bezierCurveTo(1.6, -1.2, -0.6, -1.0, -2.0, -1.1); k.bezierCurveTo(-2.9, -1.2, -3.4, -1.6, -3.3, -2.2); k.closePath();

// The squirrel runs out along the rowan branch in bursts, freezes to look around, sits up to eat a berry and runs back.
function updateSquirrel(dt) {
  const q = SQ, st = ROWAN.stem, N = st.length - 1;
  if (q.mode === "away") {
    q.t += dt;
    if (q.t < q.wait) return;
    if (MAG.mode !== "away") { q.t = 0; q.wait = 6 + Math.random() * 6; return; }
    q.mode = "in"; q.f = 0; q.dir = -1; q.pose = "run"; q.gait = 1; q.hold = 0; q.s = 2.25 * L.bk;
    q.target = N * (0.84 + 0.07 * Math.random()); q.burst = 0.6 + Math.random() * 0.5;
  }
  const seg = Math.hypot(st[1].x - st[0].x, st[1].y - st[0].y);
  if (q.mode === "sit") {
    q.sitT -= dt;
    if (q.sitT <= 0) { q.mode = "out"; q.pose = "run"; q.dir = 1; q.gait = 0; q.hold = 0.35; }
  } else {
    const goal = q.mode === "in" ? q.target : 0, sgn = q.mode === "in" ? 1 : -1;
    if (q.hold > 0) {
      q.hold -= dt; q.gait += (0 - q.gait) * Math.min(1, dt * 12);
      if (q.hold <= 0) q.burst = 0.5 + Math.random() * 0.7;
    } else {
      q.gait += (1 - q.gait) * Math.min(1, dt * 12);
      q.f += sgn * ((34 * L.bk) / seg) * dt; q.ph += dt * 17; q.burst -= dt;
      if (q.burst <= 0 && Math.abs(q.f - goal) > 6) q.hold = 0.3 + Math.random() * 0.7;
      if (sgn * (q.f - goal) >= 0) {
        q.f = goal;
        if (q.mode === "in") { q.mode = "sit"; q.pose = "sit"; q.sitT = 5 + Math.random() * 4; }
        else {
          q.mode = "away"; q.t = 0; q.wait = QS.has("sq") ? 8 : 180 + Math.random() * 150;
          for (const b of BIRDS) if (b.mode === "away") b.wait = Math.max(b.wait, b.t + 8 + Math.random() * 10);    // the birds take their time coming back
          return;
        }
      }
    }
  }
  const i = Math.min(N - 1, Math.floor(q.f)), fr = q.f - i, top = (k) => st[k].y + ROWAN.defl * st[k].t ** 2 - st[k].w * 0.5 - 0.3;
  q.x = lerp(st[i].x, st[i + 1].x, fr); q.y = lerp(top(i), top(i + 1), fr);
  const slope = Math.atan2(top(i + 1) - top(i), Math.abs(st[i + 1].x - st[i].x));
  q.pitch = q.pose === "sit" ? 0 : 0.9 * slope * (q.dir < 0 ? 1 : -1);
  // small birds do not wait to find out what it wants
  for (const b of BIRDS) {
    if (b.mode === "sit" && Math.abs(b.x - q.x) < 26 * L.bk) { b.panic = true; b.sitLeft = Math.min(b.sitLeft, Math.random() * 0.25); }
    else if (b.mode === "fly" && b.kf !== "leave" && b.perch) { b.perch.taken = null; b.perch = null; b.scared = true; launch(b, spawnPoint(b), "leave"); }
  }
}

// ---------- the flying sleigh ----------
// Far away and rarely, a sleigh crosses the top of the sky and makes one turn around the moon:
// it passes in front of the disc on the near side of its circle and behind it on the far side.
const SLC = { deer: "#d2a878", deerD: "#a67c50", antler: "#eadcc0", sleigh: "#d8402c", runner: "#f0c860", sack: "#7a9a50", coat: "#e8483c", trim: "#f6f2ea", rein: "#c9a050" };
const SL = { mode: "away", t: 0, wait: 0, s: 0, dirX: -1, x0: 0, L1: 0, C: 0, L2: 0, Rc: 0, sc: 1, ph: 0, sparkT: 0 };
let sparks = [];

function sleighAt(s) {
  const q = SL, Mx = MOON.x * L.Wd, My = MOON.y, tilt = 0.27;
  let x, z, tx, d;
  if (s < q.L1) { x = q.x0 + q.dirX * s; z = -q.Rc; tx = q.dirX; d = q.L1 - s; }
  else if (s < q.L1 + q.C) { const a = (s - q.L1) / q.Rc; x = Mx + q.dirX * q.Rc * Math.sin(a); z = -q.Rc * Math.cos(a); tx = q.dirX * Math.cos(a); d = 0; }
  else { d = s - q.L1 - q.C; x = Mx + q.dirX * d; z = -q.Rc; tx = q.dirX; }
  const y = My + tilt * z - 3.5 * (1 - Math.exp(-d / 45)) + 0.5 * Math.sin(s * 0.11);
  return { x, y, z, tx };
}

function drawDeer(ph) {
  const c = SLC, g = Math.sin(ph), h = Math.cos(ph);
  line(1.1, 0.5, 1.9 + 1.1 * g, 2.1 - 0.5 * Math.max(0, h), 0.34, c.deerD); line(1.3, 0.5, 2.3 + 0.9 * Math.sin(ph - 0.7), 2.1, 0.34, c.deerD);
  line(-1.3, 0.5, -1.9 - 1.1 * g, 2.1 - 0.5 * Math.max(0, -h), 0.34, c.deerD); line(-1.1, 0.5, -2.3 - 0.9 * Math.sin(ph - 0.7), 2.1, 0.34, c.deerD);
  shape(pEll(0, 0, 2.0, 0.85), c.deer, 0);
  shape(pEll(-2.0, -0.45, 0.4, 0.3), c.trim);
  line(1.5, -0.3, 2.35, -1.45, 0.75, c.deer);
  shape(pEll(2.8, -1.7, 0.72, 0.42, 0.25), c.deer, 0);
  line(2.3, -1.95, 1.75, -3.3, 0.24, c.antler); line(2.0, -2.7, 2.7, -3.2, 0.22, c.antler); line(1.85, -3.1, 1.2, -3.5, 0.22, c.antler);
}

function drawSleighBody() {
  const c = SLC;
  line(-2.9, 1.25, 2.3, 1.25, 0.3, c.runner); line(2.3, 1.25, 3.2, 0.35, 0.3, c.runner); line(3.2, 0.35, 2.9, -0.2, 0.3, c.runner);
  line(-1.8, 0.6, -1.8, 1.2, 0.24, c.runner); line(1.4, 0.6, 1.4, 1.2, 0.24, c.runner);
  shape(pPoly([-2.6, 0.7, 2.1, 0.7, 2.6, -0.7, 1.4, -0.55, 1.0, -0.05, -1.5, -0.05, -2.1, -1.7, -2.9, -1.7]), c.sleigh);
  shape(pEll(-1.35, -1.0, 1.0, 0.95), c.sack);
  shape(pEll(0.35, -0.95, 0.75, 0.95), c.coat);

  shape(pPoly([0.0, -2.35, 0.95, -2.35, 0.2, -3.25]), c.coat);
  shape(pEll(0.47, -2.4, 0.6, 0.2), c.trim);
}

function drawSleigh() {
  const q = SL, Mx = MOON.x * L.Wd, My = MOON.y, gap = 6.2 * q.sc;
  const units = [0, 1, 2, 3].map((k) => Object.assign(sleighAt(q.s - k * gap - (k === 3 ? 0.9 * q.sc : 0)), { k }));
  units.sort((a, b) => b.z - a.z);                     // far ones first
  for (const un of units) {
    const far = un.z > 0, zs = q.sc * (1 - 0.15 * (un.z / q.Rc)), fx = (un.tx >= 0 ? 1 : -1) * Math.max(0.3, Math.abs(un.tx));
    G2.save();
    if (far) G2.clip((c) => { c.beginPath(); c.rect(-50, -50, L.Wd + 100, 200); c.arc(Mx, My, MOON.r, 0, TAU, true); });   // hidden behind the moon
    G2.translate(un.x, un.y + 0.3 * q.sc * Math.sin(q.ph * 0.5 + un.k * 1.3)); G2.scale(fx * zs, zs);
    if (un.k === 3) drawSleighBody(); else drawDeer(q.ph + un.k * 1.9);
    G2.restore();
  }
}

function updateSleigh(dt) {
  const q = SL, Wd = L.Wd;
  for (const p of sparks) { p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 1.2 * dt; p.life -= dt * 0.75; }
  if (sparks.length) sparks = sparks.filter((p) => p.life > 0);
  if (q.mode === "away") {
    q.t += dt;
    if (q.t < q.wait) return;
    q.mode = "fly"; q.s = 0; q.sc = 1.35 * L.bk; q.Rc = MOON.r * 2.5;
    q.dirX = Math.random() < 0.7 ? -1 : 1;
    const Mx = MOON.x * Wd, edge = 36 * q.sc;
    q.x0 = q.dirX < 0 ? Wd + edge : -edge;
    q.L1 = Math.abs(Mx - q.x0); q.C = TAU * q.Rc; q.L2 = (q.dirX < 0 ? Mx : Wd - Mx) + edge;
    return;
  }
  q.s += 19 * dt; q.ph += dt * 10;
  q.sparkT -= dt;
  if (q.sparkT <= 0) {                                 // star dust falls from the runners
    q.sparkT = 0.07;
    const p = sleighAt(q.s - 3 * 6.2 * q.sc - 3.5 * q.sc), Mx = MOON.x * Wd;
    if (!(p.z > 0 && Math.hypot(p.x - Mx, p.y - MOON.y) < MOON.r)) {
      sparks.push({ x: p.x + (Math.random() - 0.5) * 2, y: p.y + 1 + Math.random() * 1.5, vx: (Math.random() - 0.5) * 1.5, vy: 0.5 + Math.random() * 1.5, life: 1, ch: [46, 46, 43, 42, 39][(Math.random() * 5) | 0] });
    }
  }
  if (q.s > q.L1 + q.C + q.L2) { q.mode = "away"; q.t = 0; q.wait = QS.has("sleigh") ? 6 : 300 + Math.random() * 360; }
}

function buildWorld() {
  const Wd = L.Wd, rnd = mulberry32(SEED + 33);
  STARS = CAT.map(([ra, dec, mag, c], k) => { const d = (dec * Math.PI) / 180; return { ra: (ra * Math.PI) / 12, sd: Math.sin(d), cd: Math.cos(d), mag, rgb: TINT[c], ph: rnd() * TAU, k }; });
  FLAKES = [];
  for (let k = 0, nf = Math.round((Wd * 100) / 60); k < nf; k++) FLAKES.push({ x: rnd() * (Wd + 10) - 5, y: rnd() * 104 - 2, z: 0.2 + rnd() * 0.8, ph: rnd() * TAU });
  ROWAN = makeRowan(); SNAG = makeSnag(); dust = [];
  const names = Wd > 110 ? ["bullfinch", "bullfinchF", "sparrow", "tit", "bullfinch", "sparrowF", "tit"] : ["bullfinch", "bullfinchF", "sparrow", "tit"];
  const first = { bullfinch: 1, sparrow: 9, tit: 17 }, seen = {};
  BIRDS = names.map((nm, k) => {
    const f = SPEC[nm].flock; seen[f] = (seen[f] || 0) + 1;
    return newBird(nm, ZOO ? 0.3 + k * 0.5 : first[f] + (seen[f] - 1) * 1.4 + Math.random());
  });
  MAG = newBird("magpie", QS.has("mag") ? 0.5 : 45 + Math.random() * 25);
  SL.mode = "away"; SL.t = 0; SL.wait = QS.has("sleigh") ? 1 : 150 + Math.random() * 200; sparks = [];
  SQ.mode = "away"; SQ.t = 0; SQ.eye = null; SQ.wait = QS.has("sq") ? 1 : 90 + Math.random() * 60;
}

// ---------- simulation ----------
function update(dt) {
  time += dt;
  const Wd = L.Wd;
  for (const f of FLAKES) {
    f.y += (3.5 + 9 * f.z) * dt;
    f.x += (Math.sin(time * 0.55 + f.ph) * 2.6 + 1.2) * f.z * dt;
    if (f.y > 102) { f.y = -2; f.x = Math.random() * (Wd + 10) - 5; }
    if (f.x > Wd + 6) f.x = -5;
  }
  updateBranch(ROWAN, dt); updateBranch(SNAG, dt);
  for (const b of BIRDS) updateBird(b, dt);
  updateBird(MAG, dt);
  updateSquirrel(dt);
  updateSleigh(dt);
  for (const p of dust) { p.vy += 9 * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt * 0.9; }
  if (dust.length) dust = dust.filter((p) => p.life > 0);
}

function drawScene() {
  const { SW, SH } = L;
  for (const [c, st] of [[S, staticS], [Dc, staticD]]) { c.setTransform(1, 0, 0, 1, 0, 0); c.clearRect(0, 0, SW, SH); c.drawImage(st, 0, 0); }
  X = S; D = Dc; setW(X); setW(D);
  if (SL.mode === "fly") drawSleigh();
  drawBranch(SNAG);
  if (MAG.mode !== "away") drawBird(MAG);
  drawBranch(ROWAN);
  for (const b of BIRDS) if (b.mode === "sit") drawBird(b);
  if (SQ.mode !== "away") drawSquirrel(SQ);
  for (const b of BIRDS) if (b.mode === "fly") drawBird(b);
}

// ---------- from picture to characters ----------
// A cell only partly covered by something gets a bare character that follows the outline.
function rimGlyph(sd, px, py, cov) {
  const { SW, SH } = L;
  let m = 0, mx = 0, my = 0, xx = 0, yy = 0, xy = 0;
  for (let j = -1; j <= 4; j++) {
    const y = py + j;
    if (y < 0 || y >= SH) continue;
    for (let q = -2; q <= 3; q++) {
      const x = px + q;
      if (x < 0 || x >= SW) continue;
      const a = sd[(y * SW + x) * 4 + 3];
      if (!a) continue;
      m += a; mx += a * q; my += a * j; xx += a * q * q; yy += a * j * j; xy += a * q * j;
    }
  }
  if (!m) return 46;
  mx /= m; my /= m; xx = xx / m - mx * mx; yy = yy / m - my * my; xy = xy / m - mx * my;
  if (Math.hypot(xx - yy, 2 * xy) / (xx + yy + 1e-6) > 0.22) return dirGlyph(0.5 * Math.atan2(2 * xy, xx - yy));
  return my < 1.0 ? 39 : my > 2.0 ? 46 : cov < 0.3 ? 58 : 42;
}

function render() {
  const { cols, rows, SW, SH, u, GX0, GY0 } = L;
  drawScene();
  const sd = S.getImageData(0, 0, SW, SH).data, dd = Dc.getImageData(0, 0, SW, SH).data;
  placeStars();
  const fT = time + 14;

  for (let q = 0; q < glassIdx.length; q++) {
    const i = glassIdx[q], c = i % cols, r = (i / cols) | 0, o = i * 3;
    let fr = BG3[o], fg = BG3[o + 1], fb = BG3[o + 2], glyph = 0, gr = 0, gg = 0, gb = 0;
    if (bgKind[i] === 3) {
      glyph = bgG[i];
      if (glyph) { const bc = bgC[i]; gr = bc >>> 16; gg = (bc >>> 8) & 255; gb = bc & 255; }
    } else {
      // how much of this cell do the things outside cover, and in what colour?
      const p0 = (r * 3 * SW + c * 2) * 4;
      let sa = 0, sr = 0, sg = 0, sb = 0;
      for (let j = 0; j < 3; j++) {
        for (let k = 0; k < 2; k++) {
          const p = p0 + (j * SW + k) * 4, a = sd[p + 3];
          if (a) { sa += a; sr += sd[p] * a; sg += sd[p + 1] * a; sb += sd[p + 2] * a; }
        }
      }
      if (sa > 150) {
        const cov = sa / 1530, R = sr / sa, Gc = sg / sa, B = sb / sa, lum = (0.3 * R + 0.59 * Gc + 0.11 * B) / 255;
        let da = 0, d1 = 0, d2 = 0;
        for (let j = 0; j < 3; j++) {
          for (let k = 0; k < 2; k++) {
            const p = p0 + (j * SW + k) * 4, a = dd[p + 3];
            if (a) { da += a; d1 += (dd[p] - 128) * a; d2 += (dd[p + 1] - 128) * a; }
          }
        }
        const tagged = da > sa * 0.5 && (d1 !== 0 || d2 !== 0);
        if (cov >= 0.55) {
          // solid: a coloured block with a character printed on it
          const k = Math.min(1, cov * 1.08);
          fr = lerp(fr, R, k); fg = lerp(fg, Gc, k); fb = lerp(fb, B, k);
          if (R > 165 && Gc < R * 0.42 && B < 70) { glyph = cellH6[i] < 0.7 ? 111 : 64; gr = R * 0.42; gg = Gc * 0.3; gb = B * 0.3; }          // rowan berries
          else if (tagged) {
            glyph = dirGlyph(0.5 * Math.atan2(d2, d1));
            if (lum > 0.4) { gr = R * 0.55; gg = Gc * 0.55; gb = B * 0.6; } else { gr = R * 1.5 + 40; gg = Gc * 1.5 + 40; gb = B * 1.5 + 46; }
          } else {
            glyph = RAMP.charCodeAt(clamp(Math.floor((1 - lum) * RAMP.length) + cellJ[i], 0, RAMP.length - 1));
            if (lum > 0.22) { gr = R * 0.45; gg = Gc * 0.45; gb = B * 0.5; } else { gr = R * 1.7 + 34; gg = Gc * 1.7 + 34; gb = B * 1.7 + 40; }
          }
        } else {
          const k = cov * 0.4;
          fr = lerp(fr, R, k); fg = lerp(fg, Gc, k); fb = lerp(fb, B, k);
          glyph = tagged ? dirGlyph(0.5 * Math.atan2(d2, d1)) : rimGlyph(sd, c * 2, r * 3, cov);
          if (lum < 0.3) { gr = R * 1.4 + 52; gg = Gc * 1.4 + 52; gb = B * 1.4 + 60; } else { gr = R; gg = Gc; gb = B; }
        }
      } else if (starG[i]) {
        const sc = starC[i];
        glyph = starG[i]; gr = sc >>> 16; gg = (sc >>> 8) & 255; gb = sc & 255;
        const hl = 0.05 + halo[i] * 0.4;
        fr += gr * hl; fg += gg * hl; fb += gb * hl;
      } else if (halo[i]) { const hv = halo[i]; fr += 150 * hv * 0.4; fg += 172 * hv * 0.4; fb += 222 * hv * 0.4; }
      else if (spk[i] && Math.sin(time * 0.8 + spk[i]) > 0.55) { glyph = spk[i] % 2 < 1 ? 46 : 42; gr = 228; gg = 238; gb = 252; }
    }

    // frost on the glass
    const eff = 1 - clr[i];
    let hide = 0;
    if (eff > 0.01) {
      const mi = mist[i] * smooth(clamp((fT - mistB[i]) / 6, 0, 1));
      if (frostB[i] <= fT && eff > 0.45) {
        const tw = 0.8 + 0.2 * Math.sin(time * 3 + cellP[i]), t = 0.5 * eff, ek = smooth(clamp((eff - 0.45) / 0.4, 0, 1));
        fr = lerp(fr, 56, t); fg = lerp(fg, 86, t); fb = lerp(fb, 124, t);
        glyph = frostG[i]; gr = lerp(gr, 226 * tw, ek); gg = lerp(gg, 244 * tw, ek); gb = lerp(gb, 255 * tw, ek);
        hide = eff;
      } else if (mi > 0.04) {
        const hz = mi * eff, t = 0.55 * hz;
        fr = lerp(fr, 52, t); fg = lerp(fg, 78, t); fb = lerp(fb, 114, t);
        if (hz > 0.22 && cellH6[i] < hz * 0.95) { glyph = cellH7[i] < 0.55 ? 46 : cellH7[i] < 0.8 ? 58 : 39; gr = 190; gg = 216; gb = 242; }
        else if (glyph) { const k = Math.min(1, hz * 1.1); gr = lerp(gr, 190, k); gg = lerp(gg, 216, k); gb = lerp(gb, 240, k); }
        hide = hz;
      }
    }
    hid[i] = hide > 0.5 ? 1 : 0;
    F3[o] = fr; F3[o + 1] = fg; F3[o + 2] = fb; G[i] = glyph;
    if (glyph) C[i] = pack(gr, gg, gb);
  }

  // eyes are stamped as a single bead, so they read against the head
  for (const b of BIRDS.concat(MAG, SQ)) {
    if (b.mode === "away" || !b.eye) continue;
    const c = Math.floor(b.eye[0] / 2), r = Math.floor(b.eye[1] / 3);
    if (c < 0 || r < 0 || c >= cols || r >= rows) continue;
    const i = r * cols + c;
    if (kind[i] !== 3 || hid[i] || bgKind[i] === 3) continue;
    G[i] = 0x25cf; C[i] = pack(b.sp.eye[0], b.sp.eye[1], b.sp.eye[2]);
  }
  // falling snow, and the snow shaken off a branch
  const speck = (x, y, g, R, Gc, B, a) => {
    const c = Math.floor((GX0 + x * u) / 2), r = Math.floor((GY0 + y * u) / 3);
    if (c < 0 || r < 0 || c >= cols || r >= rows) return;
    const i = r * cols + c;
    if (kind[i] !== 3 || hid[i] || bgKind[i] === 3) return;
    const o = i * 3, dark = F3[o] * 0.3 + F3[o + 1] * 0.59 + F3[o + 2] * 0.11 > 150 ? 0.55 : 1;
    G[i] = g; C[i] = pack(lerp(F3[o], R * dark, a), lerp(F3[o + 1], Gc * dark, a), lerp(F3[o + 2], B * dark, a));
  };
  for (const f of FLAKES) speck(f.x, f.y, f.z > 0.82 ? 42 : f.z > 0.6 ? 43 : f.z > 0.4 ? 58 : 46, 236, 244, 255, 0.55 + 0.45 * f.z);
  for (const p of dust) speck(p.x, p.y, p.ch, 240, 246, 255, Math.min(1, p.life * 1.6));
  for (const p of sparks) speck(p.x, p.y, p.ch, 255, 216, 120, Math.min(1, p.life * 1.5));

  compose();
}

// ---------- pixels: only the cells that changed are repainted ----------
const MASK = new Map();
function mask(g) {
  let m = MASK.get(g);
  if (m) return m;
  const { cwD, chD } = L;
  const x = mk(cwD, chD).getContext("2d", { willReadFrequently: true });
  x.font = `600 ${Math.round(chD * 0.78)}px ${L.font}`;
  x.textAlign = "center"; x.textBaseline = "middle"; x.fillStyle = "#fff";
  x.fillText(chr(g), cwD / 2, chD / 2 + chD * 0.06);
  const d = x.getImageData(0, 0, cwD, chD).data;
  m = new Uint8Array(cwD * chD);
  for (let k = 0; k < m.length; k++) m[k] = d[k * 4 + 3];
  MASK.set(g, m);
  return m;
}

function compose() {
  const { cols, rows, cwD, chD } = L, W = cols * cwD;
  for (let r = 0; r < rows; r++) {
    let x0 = cols, x1 = -1;
    for (let c = 0; c < cols; c++) {
      const i = r * cols + c, o = i * 3, fr = F3[o], fg = F3[o + 1], fb = F3[o + 2];
      const f = (fr << 16) | (fg << 8) | fb, g = G[i] === 32 ? 0 : G[i], col = g ? C[i] & 0xf8f8f8 : 0;
      if (f === PF[i] && g === PG[i] && col === PC[i]) continue;
      PF[i] = f; PG[i] = g; PC[i] = col;
      if (c < x0) x0 = c;
      x1 = c;
      const bg = (0xff000000 | (fb << 16) | (fg << 8) | fr) >>> 0;
      const gl = (0xff000000 | (((fb + (255 - fb) * 0.05) | 0) << 16) | (((fg + (255 - fg) * 0.05) | 0) << 8) | ((fr + (255 - fr) * 0.05) | 0)) >>> 0;   // hairline cell borders
      const xs = c * cwD, m = g ? mask(g) : null, tr = (col >>> 16) & 255, tg = (col >>> 8) & 255, tb = col & 255;
      let k = 0;
      for (let y = 0; y < chD; y++) {
        const p = (r * chD + y) * W + xs;
        for (let x = 0; x < cwD; x++) {
          const base = y === 0 || x === 0 ? gl : bg, a = m ? m[k++] : 0;
          if (a === 0) { OUT32[p + x] = base; continue; }
          const br = base & 255, bgc = (base >>> 8) & 255, bb = (base >>> 16) & 255, t = a / 255;
          OUT32[p + x] = (0xff000000 | (((bb + (tb - bb) * t) | 0) << 16) | (((bgc + (tg - bgc) * t) | 0) << 8) | ((br + (tr - br) * t) | 0)) >>> 0;
        }
      }
    }
    if (x1 >= 0) ctx.putImageData(outImg, 0, 0, x0 * cwD, r * chD, (x1 - x0 + 1) * cwD, chD);
  }
}

// ---------- wiping the frost away with the pointer ----------
function wipe(cx, cy, rad) {
  const { cols, rows } = L;
  for (let r = Math.max(0, Math.floor(cy - rad)); r <= Math.min(rows - 1, Math.ceil(cy + rad)); r++) {
    for (let c = Math.max(0, Math.floor(cx - rad)); c <= Math.min(cols - 1, Math.ceil(cx + rad)); c++) {
      const i = r * cols + c;
      if (kind[i] !== 3) continue;
      const d = Math.hypot(c - cx, (r - cy) * 1.5) / (rad * 1.5);
      if (d < 1) clr[i] = Math.max(clr[i], 1 - d * d * 0.7);
    }
  }
}
function heal(dt) {
  const d = dt * 0.022;
  for (let i = 0; i < clr.length; i++) if (clr[i] > 0) clr[i] = Math.max(0, clr[i] - d);
}

// ---------- boot ----------
function setup() {
  layout();
  const { cols, rows, cwD, chD, dpr, SW, SH, n } = L;
  canvas.width = cols * cwD; canvas.height = rows * chD;
  canvas.style.width = (cols * cwD) / dpr + "px"; canvas.style.height = (rows * chD) / dpr + "px";
  L.font = getComputedStyle(canvas).fontFamily || "monospace";
  S = mk(SW, SH).getContext("2d", { willReadFrequently: true });
  Dc = mk(SW, SH).getContext("2d", { willReadFrequently: true });
  cellJ = new Int8Array(n); cellP = new Float32Array(n); cellH6 = new Float32Array(n); cellH7 = new Float32Array(n);
  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      const i = r * cols + c;
      cellJ[i] = Math.floor(hash(c, r, SEED) * 3) - 1; cellP[i] = hash(c, r, 3) * 40; cellH6[i] = hash(c, r, 6); cellH7[i] = hash(c, r, 7);
    }
  }
  starG = new Uint16Array(n); starC = new Uint32Array(n); starCells = []; halo = new Float32Array(n); haloCells = [];
  PF = new Uint32Array(n).fill(0xffffffff); PG = new Uint16Array(n); PC = new Uint32Array(n);
  MASK.clear();
  outImg = ctx.createImageData(cols * cwD, rows * chD); OUT32 = new Uint32Array(outImg.data.buffer);
  buildCells(); genFrost(); buildWorld(); bakeStatic();
}

// A sheet of the bird models, drawn large and without the character grid, for checking anatomy.
function modelSheet() {
  const W = 1700, Hh = 1190;
  canvas.width = W; canvas.height = Hh; canvas.style.width = W + "px"; canvas.style.height = Hh + "px";
  X = ctx; D = mk(W, Hh).getContext("2d");
  ctx.fillStyle = "#1c3470"; ctx.fillRect(0, 0, W, Hh);
  const poses = [{}, { peck: 1 }, { mode: "fly", wingP: 0.02 }, { mode: "fly", wingP: 0.2 }, { mode: "fly", wingP: 0.42 }, { mode: "fly", wingP: 0.7 }, { mode: "fly", wingP: 0.9 }, { mode: "fly", wingP: -1 }, { mode: "fly", wingP: 0.1, flare: 1 }];
  ["bullfinch", "bullfinchF", "tit", "sparrow", "sparrowF", "magpie"].forEach((nm, row) => poses.forEach((ps, col) => {
    const sp = SPEC[nm], sc = nm === "magpie" ? 4.2 : 6.5, fl = ps.flare || 0;
    const b = Object.assign(newBird(nm, 0), { s: sp.s, x: 0, y: 0, mode: "sit", pitch: sp.perchPitch + (ps.peck ? 0.85 : 0), tailAng: -0.08 }, ps);
    if (b.mode === "fly") { b.pitch = -0.95 * fl; b.tailAng = -0.35 * fl; b.tailFan = fl; }
    for (const c of [X, D]) c.setTransform(sc, 0, 0, sc, 100 + col * 185, 90 + row * 160);
    drawBird(b);
  }));
  [{ ph: 0 }, { ph: 1.6 }, { ph: 3.2 }, { ph: 4.8 }, { gait: 0 }, { pose: "sit" }].forEach((ps, col) => {
    const q = Object.assign({}, SQ, { x: 0, y: 0, dir: 1, s: 2.6, pitch: 0, pose: "run", gait: 1, ph: 0 }, ps);
    for (const c of [X, D]) c.setTransform(6.5, 0, 0, 6.5, 190 + col * 270, 1150);
    drawSquirrel(q);
  });
}

canvas = document.querySelector("canvas");
ctx = canvas.getContext("2d", { alpha: false });
if (QS.has("dbg")) addEventListener("error", (e) => { document.title = "ERR " + e.message + " @" + e.lineno; });

if (QS.has("model")) modelSheet();
else {
  setup();
  const STEP = 1 / 30;
  for (let k = 0, skip = Number(QS.get("t")) || 0; k < skip / STEP; k++) update(STEP);
  if (QS.has("clear")) clr.fill(1);

  if (SAVER) {
    // as a screen saver, any real input closes it
    let ox = null, oy = null;
    const quit = () => { if (window.chrome && window.chrome.webview) window.chrome.webview.postMessage("exit"); };
    addEventListener("mousemove", (e) => { if (ox === null) { ox = e.screenX; oy = e.screenY; return; } if (Math.hypot(e.screenX - ox, e.screenY - oy) > 12) quit(); });
    for (const t of ["keydown", "mousedown", "touchstart", "wheel"]) addEventListener(t, quit);
    document.documentElement.style.cursor = "none"; canvas.style.cursor = "none";
  } else {
    const pointer = (e) => wipe((e.clientX * L.dpr) / L.cwD, (e.clientY * L.dpr) / L.chD, 3.6);
    canvas.addEventListener("pointermove", pointer);
    canvas.addEventListener("pointerdown", pointer);
  }

  let rto = 0;
  addEventListener("resize", () => { clearTimeout(rto); rto = setTimeout(() => { setup(); render(); }, 150); });

  let FPS = clamp(Number(QS.get("fps")) || 30, 5, 60), cost = 0, lastT = 0, acc = 0;
  const still = matchMedia("(prefers-reduced-motion: reduce)");
  const frame = (now) => {
    requestAnimationFrame(frame);
    if (now - lastT < 1000 / FPS - 2) return;
    const dt = Math.min(0.1, (now - lastT) / 1000);
    lastT = now; acc += dt;
    let k = 0;
    while (acc >= STEP && k < 4) { update(STEP); acc -= STEP; k++; }
    if (k === 4) acc = 0;
    heal(dt);
    const t0 = performance.now();
    render();
    cost = cost * 0.9 + (performance.now() - t0) * 0.1;
    if (!QS.has("fps")) { if (cost > (1000 / FPS) * 0.85 && FPS > 15) FPS -= 1; else if (cost < (1000 / FPS) * 0.45 && FPS < 30) FPS += 1; }
  };
  if (still.matches) { for (let k = 0; k < 600; k++) update(STEP); render(); }
  else { render(); lastT = performance.now(); requestAnimationFrame(frame); }
  if (QS.has("bench")) {
    for (let i = 0; i < 20; i++) { update(STEP); render(); }
    const t0 = performance.now();
    for (let i = 0; i < 40; i++) { update(STEP); render(); }
    document.title = "ms/frame " + ((performance.now() - t0) / 40).toFixed(1);
  }
}
</script>
